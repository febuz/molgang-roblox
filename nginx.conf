# ============================================================
# NGINX Configuration - Security, Rate Limiting, & Reverse Proxy
# ============================================================
# Features:
# - TLS/SSL encryption
# - Rate limiting (100 req/min per IP)
# - Request size limits
# - Security headers
# - JWT token validation (optional)
# - Compression
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Rate limiting
    # Zone: 10MB = ~160,000 IP addresses
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # ============================================================
    # VirtualPC Backend Upstream
    # ============================================================
    upstream virtualpc_backend {
        least_conn;
        server virtualpc:3100 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ============================================================
    # HTTPS Redirect & Main Server Block
    # ============================================================
    server {
        listen 80;
        server_name _;

        # Health check endpoint (no redirect)
        location /.well-known/health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================
    # HTTPS Server Block
    # ============================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL/TLS Configuration
        # Note: In production, use proper certificates from Let's Encrypt
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # SSL Protocol & Cipher Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS (Strict-Transport-Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

        # ============================================================
        # Health Check Endpoint
        # ============================================================
        location /health {
            access_log off;
            proxy_pass http://virtualpc_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 5s;
        }

        # ============================================================
        # API Endpoints (Rate Limited)
        # ============================================================
        location /api/ {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            # Request headers validation
            if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$) {
                return 405;
            }

            # JWT Token Validation (if X-API-Key header not present)
            if ($http_authorization = "") {
                set $auth_check 1;
            }

            # Proxy headers
            proxy_pass http://virtualpc_backend;
            proxy_http_version 1.1;

            # Forwarding headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Request-ID $request_id;

            # Connection management
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Error handling
            proxy_intercept_errors off;

            # CORS Headers (if applicable)
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # ============================================================
        # WebSocket Support (for real-time updates)
        # ============================================================
        location /ws/ {
            proxy_pass http://virtualpc_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ============================================================
        # Admin Endpoints (Stricter Rate Limiting)
        # ============================================================
        location ~ ^/admin/ {
            # Stricter rate limiting for admin endpoints
            limit_req zone=api_limit burst=5 nodelay;

            # Additional authentication required
            if ($http_x_admin_token = "") {
                return 403;
            }

            proxy_pass http://virtualpc_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ============================================================
        # Static Files & Public Assets
        # ============================================================
        location ~ ^/(js|css|images|fonts)/ {
            # Cache static files
            expires 7d;
            add_header Cache-Control "public, immutable";

            # Rate limit is less strict for static files
            limit_req zone=general_limit burst=50 nodelay;

            proxy_pass http://virtualpc_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ============================================================
        # Deny Access to Sensitive Paths
        # ============================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ /\.env {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ /\.git {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ============================================================
        # Default Proxy
        # ============================================================
        location / {
            limit_req zone=general_limit burst=30 nodelay;

            proxy_pass http://virtualpc_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ============================================================
        # Error Pages
        # ============================================================
        error_page 429 @rate_limit;
        location @rate_limit {
            default_type application/json;
            return 429 '{"error":"Rate limit exceeded","retry_after":60}';
        }

        error_page 500 502 503 504 @backend_error;
        location @backend_error {
            default_type application/json;
            return 503 '{"error":"Service temporarily unavailable"}';
        }
    }
}
