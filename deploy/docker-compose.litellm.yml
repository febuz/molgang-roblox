# LiteLLM proxy service for VirtualPC.
# Stand-alone compose file so it can run independently of the main stack.
#
#   docker compose -f deploy/docker-compose.litellm.yml up -d
#   curl http://localhost:4000/v1/models
#
# Reads cloud-provider keys from the environment. The simplest way to
# populate them: source the keys VirtualPC has stored:
#
#   eval "$(jq -r '.providers[] | "export "
#     + (.provider | ascii_upcase
#       | sub("KIMI";"MOONSHOT")
#       | sub("GROK";"XAI")
#       | sub("PERPLEXITY";"PPLX")
#       | sub("GOOGLE";"GOOGLE"))
#     + "_API_KEY=\"" + .api_key + "\""'
#     /media/knight2/EDS2/virtualpc-state/credentials.json)"
#
# Or just `source ~/.virtualpc/llm-keys.env`.

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: virtualpc-litellm
    # network_mode: host so the container can reach LM Studio on host
    # 127.0.0.1:1234 directly. The bridge route doesn't work under
    # snap-confined Docker — the bridge interface (docker0) stays DOWN
    # and bridged containers can't reach the host loopback.
    # Trade-off: `ports:` is ignored in host mode; the litellm proxy binds
    # 0.0.0.0:4000 directly, so we bind it to 127.0.0.1 via --host below.
    network_mode: host
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-virtualpc-dev}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      PPLX_API_KEY: ${PPLX_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "127.0.0.1"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health/liveliness >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
