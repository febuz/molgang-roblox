version: '3.8'

# GPU-Enabled VirtualPC Distributed Deployment
# Supports multiple instances with load balancing and automatic failover

services:
  # Neo4j Graph Database - Shared Memory (Single Instance, HA-ready)
  neo4j:
    image: neo4j:latest
    container_name: virtualpc-neo4j
    environment:
      NEO4J_AUTH: none
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 4G
    ports:
      - "7687:7687"  # Bolt
      - "7474:7474"  # HTTP
    volumes:
      - neo4j-data:/var/lib/neo4j/data
      - neo4j-logs:/var/lib/neo4j/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - virtualpc-network
    restart: unless-stopped

  # Zookeeper - Kafka Coordinator
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: virtualpc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
    ports:
      - "2181:2181"
    networks:
      - virtualpc-network
    restart: unless-stopped

  # Kafka Broker - Single for simplicity (HA cluster available)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: virtualpc-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_NUM_PARTITIONS: 10
    ports:
      - "9092:9092"
    networks:
      - virtualpc-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Redis - Cache
  redis:
    image: redis:7-alpine
    container_name: virtualpc-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - virtualpc-network
    restart: unless-stopped

  # Nginx Load Balancer - Routes to API instances
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: virtualpc-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-1
      - api-2
      - api-3
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - virtualpc-network
    restart: unless-stopped

  # VirtualPC API Instance 1 (GPU 0)
  api-1:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: virtualpc-api-1
    environment:
      NODE_ENV: production
      PORT: 3100
      INSTANCE_ID: api-1
      NEO4J_URI: bolt://neo4j:7687
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
      CUDA_VISIBLE_DEVICES: "0"
      GPU_ENABLED: "true"
    depends_on:
      - neo4j
      - kafka
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - virtualpc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # VirtualPC API Instance 2 (GPU 1)
  api-2:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: virtualpc-api-2
    environment:
      NODE_ENV: production
      PORT: 3101
      INSTANCE_ID: api-2
      NEO4J_URI: bolt://neo4j:7687
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
      CUDA_VISIBLE_DEVICES: "1"
      GPU_ENABLED: "true"
    depends_on:
      - neo4j
      - kafka
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - virtualpc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3101/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # VirtualPC API Instance 3 (GPU 2)
  api-3:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: virtualpc-api-3
    environment:
      NODE_ENV: production
      PORT: 3102
      INSTANCE_ID: api-3
      NEO4J_URI: bolt://neo4j:7687
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
      CUDA_VISIBLE_DEVICES: "2"
      GPU_ENABLED: "true"
    depends_on:
      - neo4j
      - kafka
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - virtualpc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3102/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: virtualpc-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - virtualpc-network
    restart: unless-stopped

  # Grafana - Monitoring Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: virtualpc-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - virtualpc-network
    restart: unless-stopped

volumes:
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  virtualpc-network:
    driver: bridge
