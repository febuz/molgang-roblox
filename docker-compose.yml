# virtualpc — runtime stack.
#
# What used to be 4 containers (neo4j + kafka + zookeeper + litellm)
# is now 2: neo4j for the knowledge graph + the virtualpc app itself.
# Kafka + zookeeper were unhealthy for 41 h with nothing complaining,
# so they are dropped — agent events run in-process via the existing
# event bus. The litellm container duplicated the host-side LiteLLM
# already on :4000 and is dropped too.
#
# LM Studio (port 1234) stays on the host because it owns the GPU.
# `host.docker.internal` (mapped via extra_hosts) lets containers
# reach it on Linux.

services:
  neo4j:
    image: neo4j:latest
    container_name: virtualpc-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/virtualpc-neo4j-pass
      # Sized for 629 GB RAM box: 28 G heap stays under the
      # JVM compressed-OOPs threshold, 80 G page cache holds
      # the corpus + LightRAG graph hot.
      NEO4J_server_memory_heap_initial__size: 4G
      NEO4J_server_memory_heap_max__size: 28G
      NEO4J_server_memory_pagecache_size: 80G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # headroom — context-compression token saver (github.com/chopratejas/headroom).
  # Runs as a sidecar from the published image so it is fully portable: clone the
  # repo + `docker compose up` on any server and the token saver comes with it,
  # no host Python install. Proxy mode compresses tool outputs / RAG chunks /
  # logs before they reach the LLM (60-95% fewer tokens).
  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: virtualpc-headroom
    restart: unless-stopped
    ports:
      - "8787:8787"
    command: ["proxy", "--host", "0.0.0.0", "--port", "8787"]

  virtualpc:
    build:
      context: .
      dockerfile: Dockerfile
    image: virtualpc:latest
    container_name: virtualpc-app
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: production
      PORT: "3100"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: virtualpc-neo4j-pass
      EMBED_URL: http://host.docker.internal:1234/v1
      EMBED_MODEL: text-embedding-nomic-embed-text-v1.5
      LITELLM_URL: http://host.docker.internal:4000
      # Route agent LLM traffic through the headroom token-saver sidecar.
      HEADROOM_PROXY: http://headroom:8787
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  neo4j-data:
    name: virtualpc-neo4j-data
  neo4j-logs:
    name: virtualpc-neo4j-logs
