<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>virtualpc · corpus search</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; background: #0e0f13; color: #d8dee9; margin: 0; padding: 24px; max-width: 1100px; margin: 0 auto; }
  h1 { font-weight: 500; font-size: 18px; margin: 0 0 16px; }
  h1 a { color: #7ec699; text-decoration: none; font-size: 13px; margin-left: 12px; }
  .ts { color: #6b7280; font-size: 11px; margin-left: 8px; }
  .card { background: #14161d; border: 1px solid #1f2230; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; color: #7ec699; letter-spacing: .02em; }
  .stats-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .stat { background: #1a1d27; border: 1px solid #242837; border-radius: 6px; padding: 10px 14px; min-width: 110px; }
  .stat .lbl { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: .05em; }
  .stat .val { font-size: 22px; font-weight: 600; color: #88c0d0; font-variant-numeric: tabular-nums; }
  .stat .sub { font-size: 11px; color: #7ec699; }
  .stat.warn .val { color: #d08770; }

  .search-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  input[type="text"], select {
    flex: 1; background: #1a1d27; color: #d8dee9; border: 1px solid #242837;
    padding: 10px 12px; border-radius: 6px; font-family: inherit; font-size: 13px;
  }
  input[type="text"]:focus, select:focus { outline: none; border-color: #5fb3a1; }
  select { flex: 0 0 auto; min-width: 140px; }
  button { background: #5fb3a1; color: #0e0f13; border: 0; padding: 10px 20px; border-radius: 6px;
           cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; }
  button:hover { background: #7ec699; }

  .examples { margin-top: 8px; font-size: 11px; color: #6b7280; }
  .examples a { color: #88c0d0; text-decoration: none; margin-right: 12px; cursor: pointer; }
  .examples a:hover { text-decoration: underline; }

  .result { background: #1a1d27; border: 1px solid #242837; border-radius: 6px; padding: 14px; margin-bottom: 10px; }
  .result .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .result .title { font-weight: 600; color: #88c0d0; }
  .result .id { font-size: 11px; color: #6b7280; font-family: ui-monospace, monospace; }
  .result .score { background: #24382a; color: #a3be8c; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .result .src { font-size: 11px; color: #6b7280; margin-top: 4px; }
  .result .body { margin-top: 10px; font-size: 12px; line-height: 1.6; color: #d8dee9; white-space: pre-wrap; word-wrap: break-word; max-height: 220px; overflow-y: auto; }
  .muted { color: #6b7280; }
  .empty { padding: 30px; text-align: center; color: #6b7280; }
</style>
</head>
<body>
  <h1>virtualpc · corpus <span class="ts" id="ts"></span>
    <a href="/dashboard.html">← dashboard</a>
  </h1>

  <div class="card">
    <h2>Knowledge layer state</h2>
    <div class="stats-row" id="stats">
      <div class="stat"><div class="lbl">loading</div><div class="val muted">…</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Search</h2>
    <form class="search-row" onsubmit="runSearch(event)">
      <input type="text" id="q" placeholder="ask the corpus — chemistry, code, wiki, forum threads…" autofocus />
      <select id="kind">
        <option value="">all kinds</option>
        <option value="doc">doc</option>
        <option value="code">code</option>
        <option value="shared-data">shared-data</option>
      </select>
      <button type="submit">search</button>
    </form>
    <div class="examples">
      try:
      <a onclick="quickSearch('bonding angle of water')">bonding angle of water</a>
      <a onclick="quickSearch('electron configuration carbon')">electron configuration carbon</a>
      <a onclick="quickSearch('ammonia catalyst')">ammonia catalyst</a>
      <a onclick="quickSearch('MCP tool dispatch')">MCP tool dispatch</a>
      <a onclick="quickSearch('dialogue UX bug')">dialogue UX bug</a>
    </div>
  </div>

  <div id="results"></div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n).toLocaleString();

async function loadStats() {
  try {
    const r = await fetch('/api/corpus/stats');
    const d = await r.json();
    const stats = $('stats');
    if (!d.success) { stats.innerHTML = '<div class="stat warn"><div class="lbl">offline</div><div class="val">—</div></div>'; return; }
    const cells = [
      `<div class="stat"><div class="lbl">total nodes</div><div class="val">${fmt(d.total)}</div><div class="sub">vector-indexed: ${fmt(d.vector_indexed)}</div></div>`,
    ];
    for (const [k, v] of Object.entries(d.by_kind || {})) {
      cells.push(`<div class="stat"><div class="lbl">${k}</div><div class="val">${fmt(v)}</div></div>`);
    }
    if (d.offline) cells.push('<div class="stat warn"><div class="lbl">neo4j</div><div class="val">offline</div></div>');
    stats.innerHTML = cells.join('');
    $('ts').textContent = new Date().toLocaleTimeString();
  } catch (e) { $('stats').textContent = `stats error: ${e.message}`; }
}

function escapeHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function quickSearch(q) { $('q').value = q; runSearch(); }

async function runSearch(ev) {
  if (ev) ev.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;
  const kind = $('kind').value;
  const res = $('results');
  res.innerHTML = '<div class="empty">searching…</div>';
  try {
    const url = `/api/corpus/search?q=${encodeURIComponent(q)}&k=10${kind ? '&kind=' + kind : ''}`;
    const r = await fetch(url);
    const d = await r.json();
    if (!d.success || !(d.results || []).length) {
      res.innerHTML = '<div class="empty">no hits — try a different query or remove the kind filter</div>';
      return;
    }
    res.innerHTML = d.results.map(r => `
      <div class="result">
        <div class="head">
          <span class="title">${escapeHtml(r.title || r.id)}</span>
          <span class="score">score ${r.score.toFixed(3)}</span>
        </div>
        <div class="src">${escapeHtml(r.source)} · <span class="id">${escapeHtml(r.id)}</span> · kind: ${escapeHtml(r.source_kind)}</div>
        <div class="body">${escapeHtml(r.content)}</div>
      </div>
    `).join('');
  } catch (e) { res.innerHTML = `<div class="empty">error: ${e.message}</div>`; }
}

loadStats();
setInterval(loadStats, 30000);
</script>
</body>
</html>
