<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOLGANG 3D - Chemical Engineering Simulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',sans-serif;color:#fff}
#game-canvas{width:100vw;height:100vh;display:block}

/* HUD overlay */
#hud{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:10}
#hud-top{display:flex;justify-content:space-between;padding:12px 16px}
#hud-left{display:flex;gap:10px}
#hud-right{display:flex;gap:10px}
.hud-pill{background:rgba(0,0,0,0.7);border:1px solid rgba(96,165,250,0.3);border-radius:20px;padding:5px 14px;font-size:0.8em;display:flex;align-items:center;gap:6px;backdrop-filter:blur(8px)}
.hud-pill .val{color:#60a5fa;font-weight:700}
.hud-pill.gold .val{color:#fbbf24}

/* Minimap */
#minimap{position:fixed;bottom:16px;right:16px;width:160px;height:160px;background:rgba(0,0,0,0.7);border:1px solid rgba(96,165,250,0.3);border-radius:8px;z-index:10;overflow:hidden}
#minimap canvas{width:100%;height:100%}

/* Interaction prompt */
#interact-prompt{position:fixed;bottom:50%;left:50%;transform:translate(-50%,80px);background:rgba(0,0,0,0.8);border:1px solid #60a5fa;border-radius:8px;padding:8px 20px;font-size:0.85em;z-index:10;display:none;pointer-events:none;text-align:center}
#interact-prompt .key{background:rgba(96,165,250,0.2);border:1px solid #60a5fa;border-radius:4px;padding:1px 8px;font-weight:700}

/* NPC Dialog */
#npc-dialog{display:none;position:fixed;bottom:60px;left:50%;transform:translateX(-50%);width:520px;max-width:92vw;background:rgba(8,12,24,0.95);border:1px solid #60a5fa;border-radius:12px;padding:16px;z-index:20;backdrop-filter:blur(12px)}
#npc-dialog .npc-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#npc-dialog .npc-avatar{font-size:2em}
#npc-dialog .npc-name{color:#60a5fa;font-weight:700;font-size:1.1em}
#npc-dialog .npc-text{color:#cbd5e1;line-height:1.6;font-size:0.9em;min-height:40px}
#npc-dialog .npc-btns{margin-top:10px;display:flex;gap:8px}
#npc-dialog .npc-btn{padding:6px 16px;border-radius:6px;border:1px solid #1a2a44;background:rgba(30,58,95,0.3);color:#60a5fa;cursor:pointer;font-size:0.8em;pointer-events:all}
#npc-dialog .npc-btn:hover{background:rgba(96,165,250,0.2)}
#npc-dialog .npc-btn.primary{background:rgba(34,197,94,0.2);border-color:#22c55e;color:#22c55e}

/* Station UI (chemistry, factory) */
#station-ui{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;max-width:95vw;max-height:80vh;background:rgba(8,12,24,0.95);border:1px solid #60a5fa;border-radius:12px;padding:20px;z-index:20;overflow-y:auto;backdrop-filter:blur(12px)}
#station-ui h2{color:#60a5fa;margin-bottom:12px}
#station-ui .close-btn{position:absolute;top:10px;right:14px;background:none;border:none;color:#94a3b8;font-size:1.4em;cursor:pointer}

/* Wallet panel */
#wallet{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;background:rgba(8,12,24,0.95);border:1px solid #fbbf24;border-radius:12px;padding:20px;z-index:20;backdrop-filter:blur(12px)}
#wallet h2{color:#fbbf24;margin-bottom:12px}
#wallet .close-btn{position:absolute;top:10px;right:14px;background:none;border:none;color:#94a3b8;font-size:1.4em;cursor:pointer}
.token-row{display:flex;justify-content:space-between;align-items:center;padding:10px;background:rgba(30,58,95,0.2);border-radius:6px;margin-bottom:6px}
.token-name{font-weight:600}
.token-bal{color:#fbbf24;font-weight:700;font-size:1.1em}
.token-usd{color:#94a3b8;font-size:0.8em}

/* Crosshair */
#crosshair{position:fixed;top:50%;left:50%;width:6px;height:6px;border:1px solid rgba(255,255,255,0.4);border-radius:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;display:none}

/* Loading */
#loading{position:fixed;top:0;left:0;right:0;bottom:0;background:#080c18;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
#loading h1{font-size:2em;background:linear-gradient(135deg,#60a5fa,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
#loading p{color:#94a3b8;margin-bottom:20px}
#load-bar{width:300px;height:4px;background:rgba(30,58,95,0.5);border-radius:2px;overflow:hidden}
#load-fill{height:100%;width:0%;background:linear-gradient(90deg,#60a5fa,#06b6d4);transition:width 0.3s}
#start-btn{display:none;margin-top:20px;padding:12px 40px;background:linear-gradient(135deg,#60a5fa,#06b6d4);color:white;border:none;border-radius:8px;font-size:1.1em;font-weight:700;cursor:pointer}
#start-btn:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(96,165,250,0.4)}

/* Controls help */
#controls-help{position:fixed;top:50px;left:16px;z-index:10;pointer-events:none;font-size:0.7em;color:rgba(255,255,255,0.4);line-height:1.6}

/* Toast */
#toast{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:30;pointer-events:none}
.toast-msg{padding:6px 18px;background:rgba(34,197,94,0.85);color:white;border-radius:16px;font-size:0.8em;font-weight:600;margin-bottom:4px;animation:tin .3s,tout .4s 2.5s forwards;text-align:center;backdrop-filter:blur(4px)}
.toast-msg.warn{background:rgba(245,158,11,0.85)}
.toast-msg.info{background:rgba(96,165,250,0.85)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
@keyframes tout{to{opacity:0}}
</style>
</head>
<body>

<div id="loading">
  <h1>⚗️ MOLGANG 3D</h1>
  <p>Chemical Engineering Simulator</p>
  <div id="load-bar"><div id="load-fill"></div></div>
  <button id="start-btn" onclick="startGame()">Click to Enter World</button>
</div>

<canvas id="game-canvas"></canvas>
<div id="crosshair"></div>

<div id="hud">
  <div id="hud-top">
    <div id="hud-left">
      <div class="hud-pill gold">💰 <span class="val" id="hud-coins">0</span> $MOL</div>
      <div class="hud-pill">⚛️ <span class="val" id="hud-atoms">0</span></div>
      <div class="hud-pill">⚗️ <span class="val" id="hud-mol">0</span></div>
      <div class="hud-pill">Lv <span class="val" id="hud-lvl">1</span></div>
    </div>
    <div id="hud-right">
      <div class="hud-pill" style="pointer-events:all;cursor:pointer" onclick="toggleWallet()">🔗 Wallet</div>
      <div class="hud-pill"><a href="/" style="color:#60a5fa;text-decoration:none;pointer-events:all">← Dashboard</a></div>
    </div>
  </div>
</div>

<div id="controls-help">
  WASD - Move<br>
  Mouse - Look<br>
  SHIFT - Sprint<br>
  E - Interact<br>
  TAB - Wallet<br>
  ESC - Release mouse
</div>

<div id="minimap"><canvas id="minimap-canvas" width="160" height="160"></canvas></div>
<div id="interact-prompt"><span class="key">E</span> to interact</div>
<div id="npc-dialog"></div>
<div id="station-ui"><button class="close-btn" onclick="closeStation()">&times;</button><div id="station-content"></div></div>
<div id="wallet"><button class="close-btn" onclick="toggleWallet()">&times;</button><div id="wallet-content"></div></div>
<div id="toast"></div>

<!-- Three.js r128 (last UMD build with global THREE namespace).
     cdnjs only serves up to r128; newer versions are ES-modules only.
     Pinned to r128 so the existing non-module script keeps working. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
// Defensive load check — if Three.js failed to load from CDN, swap the loading
// screen to a useful error so the user isn't stuck on a spinner forever.
if (typeof THREE === 'undefined') {
  document.addEventListener('DOMContentLoaded', () => {
    const loading = document.getElementById('loading') || document.body;
    loading.innerHTML = '<div style="color:#ef4444;padding:30px;font-family:sans-serif;">' +
      '<h2>Three.js failed to load.</h2><p>Check your network. Falling back to /game/world (WebGPU shell).</p>' +
      '<a href="/game/world" style="color:#60a5fa;">Open /game/world →</a></div>';
  });
}
</script>
<script>
// ============================================================
// MOLGANG 3D ENGINE - Three.js + WebGPU-ready + Web3 economy
// ============================================================

// === GAME STATE ===
const G = {
  coins: 100, atoms: {}, molecules: {}, fertilizer: 0, totalMol: 0, lvl: 1, xp: 0,
  walletAddress: '0x' + Array.from({length:40},()=>'0123456789abcdef'[Math.floor(Math.random()*16)]).join(''),
  molTokenBalance: 100,
  carbonCredits: 0,
};

// === THREE.JS SETUP ===
const canvas = document.getElementById('game-canvas');
let renderer, scene, camera, clock;
let player, playerMesh, mixer;
let keys = {}, mouseMovement = {x:0, y:0};
let yaw = 0, pitch = 0;
let isLocked = false;
let velocity = new THREE.Vector3();
let onGround = true;

// World objects
let worldObjects = [];
let npcs = [];
let stations = [];
let interactTarget = null;
let dialogOpen = false;
let stationOpen = false;

// === INIT ===
function init() {
  const loadFill = document.getElementById('load-fill');
  loadFill.style.width = '20%';

  // Renderer - try WebGPU, fallback to WebGL
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  } catch(e) {
    renderer = new THREE.WebGLRenderer({ canvas });
  }
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  loadFill.style.width = '40%';

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  scene.fog = new THREE.FogExp2(0x1a1a2e, 0.008);

  camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
  clock = new THREE.Clock();

  // Lighting
  const ambient = new THREE.AmbientLight(0x404060, 0.6);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
  sun.position.set(50, 80, 30);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.far = 200;
  sun.shadow.camera.left = -100;
  sun.shadow.camera.right = 100;
  sun.shadow.camera.top = 100;
  sun.shadow.camera.bottom = -100;
  scene.add(sun);

  // Point lights for atmosphere
  const labLight = new THREE.PointLight(0x60a5fa, 2, 30);
  labLight.position.set(15, 8, 15);
  scene.add(labLight);

  const factoryLight = new THREE.PointLight(0xf59e0b, 2, 30);
  factoryLight.position.set(-15, 8, 15);
  scene.add(factoryLight);

  loadFill.style.width = '60%';
  buildWorld();
  loadFill.style.width = '80%';
  createPlayer();
  loadFill.style.width = '100%';

  setTimeout(() => {
    document.getElementById('start-btn').style.display = 'block';
  }, 500);
}

// === BUILD WORLD ===
function buildWorld() {
  // Ground
  const groundGeo = new THREE.PlaneGeometry(200, 200, 40, 40);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x1a2a3a,
    roughness: 0.9,
    metalness: 0.1,
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid lines on ground
  const gridHelper = new THREE.GridHelper(200, 80, 0x1e3a5f, 0x0d1f3c);
  gridHelper.position.y = 0.01;
  scene.add(gridHelper);

  // === BUILDINGS ===

  // Chemistry Lab (blue)
  createBuilding(15, 15, 12, 7, 10, 0x1e40af, '⚛️ ATOM LAB', 'lab');

  // Fertilizer Factory (amber)
  createBuilding(-15, 15, 14, 8, 12, 0x92400e, '🏭 FACTORY', 'factory');

  // Market Exchange (purple)
  createBuilding(15, -15, 10, 6, 10, 0x4c1d95, '📊 MARKET', 'market');

  // University / Advanced Labs (green)
  createBuilding(-15, -15, 16, 9, 14, 0x14532d, '🔬 ADVANCED LABS', 'advlab');

  // Token Exchange (gold)
  createBuilding(0, -30, 8, 6, 8, 0x713f12, '🔗 $MOL EXCHANGE', 'exchange');

  // Central fountain/hub
  const fountainGeo = new THREE.CylinderGeometry(3, 4, 1.5, 16);
  const fountainMat = new THREE.MeshStandardMaterial({ color: 0x1e3a5f, metalness: 0.5, roughness: 0.3 });
  const fountain = new THREE.Mesh(fountainGeo, fountainMat);
  fountain.position.set(0, 0.75, 0);
  fountain.castShadow = true;
  scene.add(fountain);

  // Water in fountain
  const waterGeo = new THREE.CylinderGeometry(2.8, 2.8, 0.1, 16);
  const waterMat = new THREE.MeshStandardMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.6, metalness: 0.8 });
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.position.set(0, 1.5, 0);
  scene.add(water);

  // Paths (lighter ground strips)
  createPath(0, 0, 0, 15, 3, 30);  // N-S
  createPath(0, 0, 15, 0, 30, 3);  // E-W

  // Atom spawners (floating elements in the world)
  for (let i = 0; i < 30; i++) {
    spawnWorldAtom();
  }

  // === NPCs ===
  createNPC(5, 3, 'Dr. Femke', '👩‍🔬', 0x60a5fa, [
    'Welcome to MOLGANG! This chemical plant is your playground.',
    'Walk to the Atom Lab to collect elements. The Factory produces fertilizer.',
    'Your $MOL tokens are earned by synthesizing molecules and selling on the market.',
    'The Advanced Labs unlock at Level 10 with distillation columns and reactor design.'
  ]);

  createNPC(-5, 5, 'Farmer Chen', '👨‍🌾', 0x22c55e, [
    'My fields need fertilizer! Visit the Factory to produce some.',
    'The NPK balance matters - wheat needs different nutrients than rice.',
    'I pay well in $MOL tokens for high-quality fertilizer!',
    'You can trade your $MOL on the exchange for carbon credits.'
  ]);

  createNPC(8, -5, 'Kwantje', '🔬', 0xa855f7, [
    'I study quantum molecular dynamics! The atoms here behave by real chemistry rules.',
    'H₂SO₄ - Sulfuric acid - is the world\'s most produced chemical. Can you make it?',
    'The legendary MolCrystal requires Fe, S, Ca, Na, and K. Rare elements!',
    'At Level 10, you can design distillation columns. Real chemical engineering!'
  ]);

  createNPC(-6, -8, 'Vanadis', '⚡', 0xfbbf24, [
    'I manage the $MOL token economy. Every molecule you synthesize earns tokens.',
    '$MOL runs on a carbon-credit system. Produce clean - earn more!',
    'Trade your tokens at the Exchange building. Prices fluctuate!',
    'Top earners get listed on the global leaderboard. Keep producing!'
  ]);

  // Trees / decoration
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 50;
    createTree(Math.cos(angle)*dist, Math.sin(angle)*dist);
  }
}

function createBuilding(x, z, w, h, d, color, label, stationType) {
  const group = new THREE.Group();

  // Main body
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.2 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = h/2;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);

  // Roof accent
  const roofGeo = new THREE.BoxGeometry(w+0.5, 0.3, d+0.5);
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.4 });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.y = h;
  group.add(roof);

  // Glowing windows
  for (let wy = 2; wy < h-1; wy += 2.5) {
    for (let wz = -d/2+2; wz < d/2-1; wz += 3) {
      const winGeo = new THREE.PlaneGeometry(1.2, 1.5);
      const winMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.3 + Math.random()*0.3 });
      const win = new THREE.Mesh(winGeo, winMat);
      win.position.set(w/2+0.01, wy, wz);
      group.add(win);
      const win2 = win.clone();
      win2.position.x = -w/2-0.01;
      win2.rotation.y = Math.PI;
      group.add(win2);
    }
  }

  // Door
  const doorGeo = new THREE.BoxGeometry(2.5, 3.5, 0.2);
  const doorMat = new THREE.MeshStandardMaterial({ color: 0x0d1f3c, emissive: 0x1e3a5f, emissiveIntensity: 0.3 });
  const door = new THREE.Mesh(doorGeo, doorMat);
  door.position.set(0, 1.75, d/2+0.1);
  group.add(door);

  group.position.set(x, 0, z);
  scene.add(group);
  worldObjects.push({ mesh: group, type: 'building', bounds: { x, z, w: w/2+1, d: d/2+1 }});

  // Station interaction zone
  stations.push({
    pos: new THREE.Vector3(x, 0, z + d/2 + 2),
    type: stationType,
    label: label,
    radius: 4,
  });
}

function createPath(x, z, dx, dz, w, d) {
  const geo = new THREE.PlaneGeometry(w, d);
  const mat = new THREE.MeshStandardMaterial({ color: 0x1e3a5f, roughness: 0.95 });
  const path = new THREE.Mesh(geo, mat);
  path.rotation.x = -Math.PI/2;
  path.position.set(x+dx/2, 0.02, z+dz/2);
  scene.add(path);
}

function createTree(x, z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.2, 2, 6),
    new THREE.MeshStandardMaterial({ color: 0x4a3728 })
  );
  trunk.position.set(x, 1, z);
  trunk.castShadow = true;
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 8, 6),
    new THREE.MeshStandardMaterial({ color: 0x1a4a2a, roughness: 0.9 })
  );
  leaves.position.set(x, 3, z);
  leaves.castShadow = true;
  scene.add(leaves);
}

// === FLOATING WORLD ATOMS ===
let worldAtoms = [];
function spawnWorldAtom() {
  const elements = ['H','O','C','N','Na','Cl','Ca','Fe','S','P','K'];
  const colors = {H:0xe0e0e0,O:0xff4444,C:0x666666,N:0x4488ff,Na:0xffaa00,Cl:0x00ff88,Ca:0xcccccc,Fe:0xcc6633,S:0xdddd44,P:0xff66ff,K:0xaa66ff};
  const maxIdx = Math.min(elements.length, 3 + G.lvl * 2);
  const el = elements[Math.floor(Math.random() * maxIdx)];

  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 12, 8),
    new THREE.MeshStandardMaterial({ color: colors[el], emissive: colors[el], emissiveIntensity: 0.3, metalness: 0.4 })
  );

  const angle = Math.random() * Math.PI * 2;
  const dist = 5 + Math.random() * 35;
  sphere.position.set(Math.cos(angle)*dist, 1 + Math.random()*2, Math.sin(angle)*dist);
  scene.add(sphere);

  worldAtoms.push({
    mesh: sphere,
    element: el,
    bobSpeed: 1 + Math.random(),
    bobOffset: Math.random() * Math.PI * 2,
    baseY: sphere.position.y,
    life: 600 + Math.random() * 600,
  });
}

// === NPCs ===
function createNPC(x, z, name, emoji, color, dialogues) {
  const group = new THREE.Group();

  // Body
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.4, 1.6, 8),
    new THREE.MeshStandardMaterial({ color, roughness: 0.7 })
  );
  body.position.y = 1;
  group.add(body);

  // Head
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 10, 8),
    new THREE.MeshStandardMaterial({ color: 0xffcc88, roughness: 0.8 })
  );
  head.position.y = 2.1;
  group.add(head);

  // Name indicator
  const indicator = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0x60a5fa })
  );
  indicator.position.y = 2.8;
  group.add(indicator);

  group.position.set(x, 0, z);
  group.castShadow = true;
  scene.add(group);

  npcs.push({
    group, name, emoji, dialogues,
    pos: new THREE.Vector3(x, 0, z),
    dialogIdx: 0,
    radius: 3,
  });
}

// === PLAYER ===
function createPlayer() {
  player = new THREE.Group();

  // Body
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.6 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.4, 8), bodyMat);
  body.position.y = 0.9;
  player.add(body);

  // Head
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 10, 8),
    new THREE.MeshStandardMaterial({ color: 0xffcc88 })
  );
  head.position.y = 1.9;
  player.add(head);

  // Lab coat detail
  const coat = new THREE.Mesh(
    new THREE.CylinderGeometry(0.38, 0.45, 0.8, 8),
    new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.8 })
  );
  coat.position.y = 0.6;
  player.add(coat);

  player.position.set(0, 0, 8);
  player.castShadow = true;
  scene.add(player);
  playerMesh = player;
}

// === CONTROLS ===
function setupControls() {
  document.addEventListener('keydown', e => { keys[e.code] = true; if(e.code==='Tab'){e.preventDefault();toggleWallet()} });
  document.addEventListener('keyup', e => { keys[e.code] = false; });

  canvas.addEventListener('click', () => {
    if (!isLocked) canvas.requestPointerLock();
  });

  document.addEventListener('pointerlockchange', () => {
    isLocked = !!document.pointerLockElement;
    document.getElementById('crosshair').style.display = isLocked ? 'block' : 'none';
  });

  document.addEventListener('mousemove', e => {
    if (!isLocked) return;
    mouseMovement.x = e.movementX || 0;
    mouseMovement.y = e.movementY || 0;
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// === GAME LOOP ===
function gameLoop() {
  requestAnimationFrame(gameLoop);
  const dt = Math.min(clock.getDelta(), 0.1);
  const time = clock.getElapsedTime();

  if (dialogOpen || stationOpen) {
    renderer.render(scene, camera);
    return;
  }

  // Mouse look
  if (isLocked) {
    yaw -= mouseMovement.x * 0.002;
    pitch -= mouseMovement.y * 0.002;
    pitch = Math.max(-1.2, Math.min(1.2, pitch));
    mouseMovement.x = 0;
    mouseMovement.y = 0;
  }

  // Movement
  const speed = keys['ShiftLeft'] ? 12 : 6;
  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

  velocity.multiplyScalar(0.85);
  if (keys['KeyW']) velocity.add(forward.clone().multiplyScalar(speed * dt));
  if (keys['KeyS']) velocity.add(forward.clone().multiplyScalar(-speed * dt));
  if (keys['KeyA']) velocity.add(right.clone().multiplyScalar(-speed * dt));
  if (keys['KeyD']) velocity.add(right.clone().multiplyScalar(speed * dt));

  // Apply movement with collision
  const nextPos = player.position.clone().add(velocity);
  let blocked = false;
  for (const obj of worldObjects) {
    if (obj.type === 'building') {
      const b = obj.bounds;
      if (Math.abs(nextPos.x - b.x) < b.w && Math.abs(nextPos.z - b.z) < b.d) {
        blocked = true;
        break;
      }
    }
  }
  if (!blocked) {
    player.position.copy(nextPos);
    // World boundary
    player.position.x = Math.max(-90, Math.min(90, player.position.x));
    player.position.z = Math.max(-90, Math.min(90, player.position.z));
  }
  player.position.y = 0;
  player.rotation.y = yaw;

  // Camera follow (third person)
  const camDist = 5;
  const camHeight = 3;
  const camTarget = new THREE.Vector3(
    player.position.x + Math.sin(yaw) * camDist,
    player.position.y + camHeight,
    player.position.z + Math.cos(yaw) * camDist
  );
  camera.position.lerp(camTarget, 0.1);
  const lookAt = new THREE.Vector3(player.position.x, player.position.y + 1.5, player.position.z);
  camera.lookAt(lookAt);

  // Atom bobbing + collection
  for (let i = worldAtoms.length - 1; i >= 0; i--) {
    const a = worldAtoms[i];
    a.mesh.position.y = a.baseY + Math.sin(time * a.bobSpeed + a.bobOffset) * 0.3;
    a.mesh.rotation.y += dt * 1.5;
    a.life -= 1;

    // Auto-collect when player is near
    const dist = player.position.distanceTo(a.mesh.position);
    if (dist < 2) {
      G.atoms[a.element] = (G.atoms[a.element] || 0) + 1;
      G.xp += 5;
      scene.remove(a.mesh);
      worldAtoms.splice(i, 1);
      toast(`+1 ${a.element}`, 'info');
      refreshHUD();
      checkLvl();
      continue;
    }

    if (a.life <= 0) {
      scene.remove(a.mesh);
      worldAtoms.splice(i, 1);
    }
  }

  // Respawn atoms
  if (worldAtoms.length < 20 + G.lvl * 3 && Math.random() < 0.02) {
    spawnWorldAtom();
  }

  // Interaction check
  interactTarget = null;
  const promptEl = document.getElementById('interact-prompt');
  promptEl.style.display = 'none';

  // Check NPCs
  for (const npc of npcs) {
    if (player.position.distanceTo(npc.pos) < npc.radius) {
      interactTarget = { type: 'npc', data: npc };
      promptEl.innerHTML = `<span class="key">E</span> Talk to ${npc.name}`;
      promptEl.style.display = 'block';
      break;
    }
  }

  // Check stations
  if (!interactTarget) {
    for (const st of stations) {
      if (player.position.distanceTo(st.pos) < st.radius) {
        interactTarget = { type: 'station', data: st };
        promptEl.innerHTML = `<span class="key">E</span> Enter ${st.label}`;
        promptEl.style.display = 'block';
        break;
      }
    }
  }

  // E key interaction
  if (keys['KeyE'] && interactTarget) {
    keys['KeyE'] = false;
    if (interactTarget.type === 'npc') openNPCDialog(interactTarget.data);
    if (interactTarget.type === 'station') openStation(interactTarget.data);
  }

  // Update minimap
  updateMinimap();

  renderer.render(scene, camera);
}

// === HUD ===
function refreshHUD() {
  document.getElementById('hud-coins').textContent = G.coins;
  document.getElementById('hud-atoms').textContent = Object.values(G.atoms).reduce((a,b)=>a+b,0);
  document.getElementById('hud-mol').textContent = G.totalMol;
  document.getElementById('hud-lvl').textContent = G.lvl;
}

function checkLvl() {
  if (G.xp >= G.lvl * 120) { G.xp -= G.lvl * 120; G.lvl++; toast(`🎉 Level ${G.lvl}!`); refreshHUD(); }
}

// === MINIMAP ===
function updateMinimap() {
  const mc = document.getElementById('minimap-canvas');
  const ctx = mc.getContext('2d');
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0,0,160,160);

  const scale = 0.8;
  const ox = 80, oz = 80;

  // Buildings
  const buildingColors = { lab: '#1e40af', factory: '#92400e', market: '#4c1d95', advlab: '#14532d', exchange: '#713f12' };
  for (const st of stations) {
    ctx.fillStyle = buildingColors[st.type] || '#1e3a5f';
    ctx.fillRect(ox + st.pos.x * scale - 4, oz + st.pos.z * scale - 6, 8, 8);
  }

  // Player
  ctx.fillStyle = '#60a5fa';
  ctx.beginPath();
  ctx.arc(ox + player.position.x * scale, oz + player.position.z * scale, 3, 0, Math.PI * 2);
  ctx.fill();

  // Direction indicator
  ctx.strokeStyle = '#60a5fa';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(ox + player.position.x * scale, oz + player.position.z * scale);
  ctx.lineTo(
    ox + (player.position.x - Math.sin(yaw) * 6) * scale,
    oz + (player.position.z - Math.cos(yaw) * 6) * scale
  );
  ctx.stroke();

  // NPCs
  for (const npc of npcs) {
    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.arc(ox + npc.pos.x * scale, oz + npc.pos.z * scale, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// === NPC DIALOG ===
function openNPCDialog(npc) {
  dialogOpen = true;
  document.exitPointerLock();
  const dlg = document.getElementById('npc-dialog');
  dlg.innerHTML = `
    <div class="npc-head"><span class="npc-avatar">${npc.emoji}</span><span class="npc-name">${npc.name}</span></div>
    <div class="npc-text">${npc.dialogues[npc.dialogIdx % npc.dialogues.length]}</div>
    <div class="npc-btns">
      <button class="npc-btn primary" onclick="nextDialog()">Continue →</button>
      <button class="npc-btn" onclick="closeDialog()">Close</button>
    </div>
  `;
  dlg.style.display = 'block';
}
function nextDialog() {
  if (!interactTarget || interactTarget.type !== 'npc') return;
  const npc = interactTarget.data;
  npc.dialogIdx++;
  document.querySelector('#npc-dialog .npc-text').textContent = npc.dialogues[npc.dialogIdx % npc.dialogues.length];
}
function closeDialog() {
  document.getElementById('npc-dialog').style.display = 'none';
  dialogOpen = false;
}

// === STATION UI ===
function openStation(station) {
  stationOpen = true;
  document.exitPointerLock();
  const content = document.getElementById('station-content');
  const ui = document.getElementById('station-ui');

  if (station.type === 'lab') {
    content.innerHTML = buildLabUI();
  } else if (station.type === 'factory') {
    content.innerHTML = buildFactoryUI();
  } else if (station.type === 'market') {
    content.innerHTML = buildMarketUI();
  } else if (station.type === 'exchange') {
    content.innerHTML = buildExchangeUI();
  } else if (station.type === 'advlab') {
    content.innerHTML = `<h2>🔬 Advanced Labs</h2><p style="color:#94a3b8;margin-top:10px">Distillation columns, reactor kinetics, and process flow diagram editor.</p><p style="color:#f59e0b;margin-top:10px;font-weight:600">🔒 Unlocks at Level 10 (current: Level ${G.lvl})</p><p style="color:#94a3b8;margin-top:20px;font-size:0.85em">Master the basics in Roblox MOLGANG first, then graduate to these advanced web-only simulations featuring real chemical engineering calculations.</p>`;
  }
  ui.style.display = 'block';
}
function closeStation() {
  document.getElementById('station-ui').style.display = 'none';
  stationOpen = false;
}

// === LAB UI ===
function buildLabUI() {
  const recipes = [
    {n:'Water',f:'H₂O',need:{H:2,O:1},rw:10},
    {n:'CO₂',f:'CO₂',need:{C:1,O:2},rw:15},
    {n:'Ammonia',f:'NH₃',need:{N:1,H:3},rw:20},
    {n:'Salt',f:'NaCl',need:{Na:1,Cl:1},rw:12},
    {n:'Methane',f:'CH₄',need:{C:1,H:4},rw:25},
    {n:'H₂SO₄',f:'H₂SO₄',need:{H:2,S:1,O:4},rw:50},
    {n:'Urea',f:'CO(NH₂)₂',need:{C:1,O:1,N:2,H:4},rw:60},
  ];

  const atomsHTML = Object.entries(G.atoms).filter(([,c])=>c>0).map(([s,c])=>`<span style="margin-right:8px;color:#60a5fa">${s}:${c}</span>`).join('') || '<span style="color:#94a3b8">Walk near floating atoms to collect them!</span>';

  const recipesHTML = recipes.map((r,i) => {
    const can = Object.entries(r.need).every(([s,n])=>(G.atoms[s]||0)>=n);
    const needs = Object.entries(r.need).map(([s,n])=>`<span style="color:${(G.atoms[s]||0)>=n?'#22c55e':'#ef4444'}">${s}:${G.atoms[s]||0}/${n}</span>`).join(' ');
    return `<div style="padding:8px;background:rgba(30,58,95,${can?'0.3':'0.1'});border:1px solid ${can?'#22c55e':'#1a2a44'};border-radius:6px;margin-bottom:6px;cursor:${can?'pointer':'default'}" onclick="${can?`synthesize('${r.n}',${JSON.stringify(r.need).replace(/"/g,"'")},${r.rw})`:''}">${can?'✅':'⬜'} <strong>${r.n}</strong> (${r.f}) — ${needs} — 💰 +${r.rw} $MOL</div>`;
  }).join('');

  return `<h2>⚛️ Atom Lab — Synthesis</h2>
    <div style="margin:10px 0;padding:10px;background:rgba(30,58,95,0.2);border-radius:6px">
      <strong style="color:#60a5fa">Your Atoms:</strong><br>${atomsHTML}
    </div>
    <h3 style="color:#60a5fa;font-size:0.9em;margin:10px 0">Recipes (click green ones to craft):</h3>
    ${recipesHTML}`;
}

// === FACTORY UI ===
function buildFactoryUI() {
  const has = (G.atoms.N||0)>=3 && (G.atoms.H||0)>=6 && (G.atoms.C||0)>=1 && (G.atoms.O||0)>=1;
  return `<h2>🏭 Fertilizer Factory</h2>
    <p style="color:#94a3b8;margin:8px 0">Produce Urea fertilizer from your atoms. Requires: N:3, H:6, C:1, O:1</p>
    <div style="padding:10px;background:rgba(30,58,95,0.2);border-radius:6px;margin:10px 0">
      <strong>Available:</strong> N:${G.atoms.N||0} H:${G.atoms.H||0} C:${G.atoms.C||0} O:${G.atoms.O||0}
    </div>
    <div style="padding:10px;background:rgba(30,58,95,0.2);border-radius:6px;margin:10px 0">
      <strong>Fertilizer produced:</strong> ${G.fertilizer} batches
    </div>
    <button onclick="produceFert()" style="width:100%;padding:12px;background:${has?'linear-gradient(135deg,#22c55e,#06b6d4)':'#333'};color:white;border:none;border-radius:8px;font-weight:700;font-size:1em;cursor:${has?'pointer':'not-allowed'}" ${has?'':'disabled'}>
      🏭 Produce 1x Urea (+40 $MOL)
    </button>`;
}

// === MARKET UI ===
function buildMarketUI() {
  const items = Object.entries(G.molecules).filter(([,c])=>c>0);
  const listings = items.map(([n,c]) => {
    const price = 10 + Math.floor(Math.random()*30);
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:rgba(30,58,95,0.2);border-radius:6px;margin-bottom:6px">
      <span>⚗️ ${n} (x${c})</span>
      <button onclick="sellItem('${n}',${price})" style="padding:4px 12px;background:#22c55e;color:white;border:none;border-radius:4px;cursor:pointer">Sell for ${price} $MOL</button>
    </div>`;
  }).join('');

  return `<h2>📊 Market Exchange</h2>
    <p style="color:#94a3b8;margin:8px 0">Sell molecules for $MOL tokens. Prices fluctuate!</p>
    ${listings || '<p style="color:#94a3b8">No molecules to sell. Synthesize some first!</p>'}
    ${G.fertilizer > 0 ? `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:rgba(30,58,95,0.2);border-radius:6px;margin-bottom:6px">
      <span>🌾 Urea Fertilizer (x${G.fertilizer})</span>
      <button onclick="sellFert()" style="padding:4px 12px;background:#fbbf24;color:black;border:none;border-radius:4px;cursor:pointer">Sell for 50 $MOL</button>
    </div>` : ''}`;
}

// === EXCHANGE UI ===
function buildExchangeUI() {
  return `<h2>🔗 $MOL Token Exchange</h2>
    <p style="color:#94a3b8;margin:8px 0">Your Web3 wallet for the MOLGANG economy</p>
    <div style="padding:12px;background:rgba(30,58,95,0.2);border-radius:8px;margin:10px 0">
      <div style="font-size:0.75em;color:#94a3b8">Wallet Address</div>
      <div style="font-family:monospace;color:#60a5fa;font-size:0.8em;word-break:break-all">${G.walletAddress}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0">
      <div style="padding:12px;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);border-radius:8px;text-align:center">
        <div style="color:#94a3b8;font-size:0.75em">$MOL Balance</div>
        <div style="color:#fbbf24;font-size:1.5em;font-weight:700">${G.coins}</div>
      </div>
      <div style="padding:12px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:8px;text-align:center">
        <div style="color:#94a3b8;font-size:0.75em">Carbon Credits</div>
        <div style="color:#22c55e;font-size:1.5em;font-weight:700">${G.carbonCredits}</div>
      </div>
    </div>
    <button onclick="convertToCarbon()" style="width:100%;padding:10px;background:linear-gradient(135deg,#22c55e,#06b6d4);color:white;border:none;border-radius:6px;font-weight:600;cursor:pointer;margin-top:8px" ${G.coins>=100?'':'disabled'}>
      Convert 100 $MOL → 1 Carbon Credit
    </button>
    <p style="color:#94a3b8;font-size:0.75em;margin-top:8px">Carbon credits represent verified emissions reductions. Trade them on the global MOLCO2 marketplace.</p>`;
}

// === GAME ACTIONS ===
window.synthesize = function(name, needs, reward) {
  const needObj = typeof needs === 'string' ? JSON.parse(needs.replace(/'/g,'"')) : needs;
  for (const [s,n] of Object.entries(needObj)) {
    if ((G.atoms[s]||0) < n) { toast(`Need more ${s}!`, 'warn'); return; }
  }
  for (const [s,n] of Object.entries(needObj)) G.atoms[s] -= n;
  G.molecules[name] = (G.molecules[name]||0) + 1;
  G.totalMol++;
  G.coins += reward;
  G.xp += reward;
  toast(`⚗️ ${name}! +${reward} $MOL`);
  checkLvl(); refreshHUD();
  document.getElementById('station-content').innerHTML = buildLabUI();
};

window.produceFert = function() {
  if ((G.atoms.N||0)<3||(G.atoms.H||0)<6||(G.atoms.C||0)<1||(G.atoms.O||0)<1) return;
  G.atoms.N-=3; G.atoms.H-=6; G.atoms.C-=1; G.atoms.O-=1;
  G.fertilizer++; G.coins+=40; G.xp+=40;
  toast('🏭 Fertilizer produced! +40 $MOL');
  checkLvl(); refreshHUD();
  document.getElementById('station-content').innerHTML = buildFactoryUI();
};

window.sellItem = function(name, price) {
  if ((G.molecules[name]||0)<1) return;
  G.molecules[name]--;
  G.coins += price;
  toast(`💰 Sold ${name} for ${price} $MOL`);
  refreshHUD();
  document.getElementById('station-content').innerHTML = buildMarketUI();
};

window.sellFert = function() {
  if (G.fertilizer<1) return;
  G.fertilizer--; G.coins+=50;
  toast('💰 Sold fertilizer for 50 $MOL');
  refreshHUD();
  document.getElementById('station-content').innerHTML = buildMarketUI();
};

window.convertToCarbon = function() {
  if (G.coins < 100) return;
  G.coins -= 100;
  G.carbonCredits++;
  toast('🌿 Converted to 1 Carbon Credit!');
  refreshHUD();
  document.getElementById('station-content').innerHTML = buildExchangeUI();
};

// === WALLET ===
function toggleWallet() {
  const w = document.getElementById('wallet');
  if (w.style.display === 'block') { w.style.display = 'none'; return; }
  document.getElementById('wallet-content').innerHTML = `
    <h2>🔗 $MOL Wallet</h2>
    <div style="margin:10px 0;padding:8px;background:rgba(30,58,95,0.2);border-radius:6px;font-family:monospace;font-size:0.7em;color:#94a3b8;word-break:break-all">${G.walletAddress}</div>
    <div class="token-row"><span class="token-name">💰 $MOL Token</span><span><span class="token-bal">${G.coins}</span><br><span class="token-usd">≈ $${(G.coins*0.01).toFixed(2)}</span></span></div>
    <div class="token-row"><span class="token-name">🌿 MOLCO2 Carbon</span><span><span class="token-bal">${G.carbonCredits}</span><br><span class="token-usd">≈ $${(G.carbonCredits*15).toFixed(2)}</span></span></div>
    <div class="token-row"><span class="token-name">⚗️ Molecules (NFT)</span><span><span class="token-bal">${G.totalMol}</span></span></div>
  `;
  w.style.display = 'block';
}

// === TOAST ===
function toast(m, t) {
  const e = document.createElement('div');
  e.className = 'toast-msg' + (t ? ' ' + t : '');
  e.textContent = m;
  document.getElementById('toast').appendChild(e);
  setTimeout(() => e.remove(), 3000);
}

// === START ===
function startGame() {
  document.getElementById('loading').style.display = 'none';
  setupControls();
  gameLoop();
  toast('Welcome to MOLGANG 3D! Walk around with WASD, look with mouse.', 'info');
  setTimeout(() => toast('Walk near floating atoms to collect them!', 'info'), 3000);
  setTimeout(() => toast('Press E near buildings and NPCs to interact', 'info'), 6000);
}

init();
</script>
