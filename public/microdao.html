<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MicroDAO — P2P Micro-Post Network</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0b0d;
      --bg2:       #111318;
      --bg3:       #181c22;
      --bg4:       #1e232c;
      --border:    #252b35;
      --accent:    #c0f748;
      --accent-dim:#7db02e;
      --accent-bg: rgba(192,247,72,0.07);
      --text:      #e8eaf0;
      --text-dim:  #7a8190;
      --text-faint:#454c59;
      --red:       #ff4d6a;
      --red-bg:    rgba(255,77,106,0.10);
      --yellow:    #f7c948;
      --yellow-bg: rgba(247,201,72,0.10);
      --blue:      #48b8f7;
      --blue-bg:   rgba(72,184,247,0.10);
      --radius:    8px;
      --radius-sm: 5px;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    html { font-size: 15px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.55;
      min-height: 100vh;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

    /* ── Layout ── */
    .page-shell {
      display: grid;
      grid-template-rows: auto auto 1fr;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }

    /* ── Top bar ── */
    #top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,11,13,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.45rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.82rem;
      color: var(--text-dim);
      margin: 0 -1rem;
    }
    #top-bar .logo {
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent);
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    #top-bar .logo span { color: var(--text-dim); font-weight: 400; }
    #stats-text { flex: 1; }
    #stats-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; }
      50%      { opacity:0.4; }
    }
    #last-updated { color: var(--text-faint); font-size: 0.77rem; }

    /* ── Nav tabs ── */
    nav {
      display: flex;
      gap: 0.25rem;
      padding: 1rem 0 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    nav button {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.55rem 1rem;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-dim);
      cursor: pointer;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      margin-bottom: -1px;
    }
    nav button:hover { color: var(--text); background: var(--bg2); }
    nav button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── Panels ── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Section headings ── */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .section-head h2 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.2px;
    }
    .section-head h2 .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid rgba(192,247,72,0.2);
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0 0.5rem;
      height: 18px;
      margin-left: 0.4rem;
      vertical-align: middle;
    }

    /* ── Feed ── */
    #feed-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .feed-empty {
      text-align: center;
      color: var(--text-faint);
      padding: 3rem 1rem;
      font-size: 0.9rem;
    }

    /* ── Post card ── */
    .post-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .post-card:hover { border-color: var(--text-faint); background: var(--bg3); }
    .post-card.expanded { border-color: var(--accent); background: var(--bg3); }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .post-author {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .post-ts { color: var(--text-faint); }
    .post-badges { display: flex; gap: 0.3rem; align-items: center; margin-left: auto; flex-wrap: wrap; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      border-radius: 99px;
      padding: 0.1rem 0.55rem;
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-ttl  { background: var(--yellow-bg); color: var(--yellow); border: 1px solid rgba(247,201,72,0.2); }
    .badge-chain{ background: var(--blue-bg);   color: var(--blue);   border: 1px solid rgba(72,184,247,0.2); }

    .post-line1 {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.2rem;
      word-break: break-word;
    }
    .post-line2 {
      font-size: 0.88rem;
      color: var(--text-dim);
      word-break: break-word;
    }
    .post-expand {
      display: none;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-faint);
    }
    .post-card.expanded .post-expand { display: block; }
    .post-id {
      font-family: var(--mono);
      font-size: 0.72rem;
      background: var(--bg4);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.3rem 0.6rem;
      word-break: break-all;
      color: var(--text-dim);
      margin-top: 0.3rem;
    }
    .expand-label { color: var(--text-faint); font-size: 0.72rem; margin-bottom: 0.2rem; }

    /* ── Publish form ── */
    .form-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.25rem 1rem;
      max-width: 640px;
    }

    .form-row { margin-bottom: 1rem; }
    .form-row label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 0.35rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .form-row .hint {
      font-size: 0.73rem;
      color: var(--text-faint);
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      margin-left: 0.4rem;
    }

    input[type="text"],
    input[type="datetime-local"],
    textarea {
      width: 100%;
      background: var(--bg4);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      padding: 0.6rem 0.75rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"]:focus,
    input[type="datetime-local"]:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(192,247,72,0.12);
    }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(0.7);
      cursor: pointer;
    }
    textarea { resize: vertical; min-height: 60px; }

    .char-counter {
      text-align: right;
      font-size: 0.73rem;
      color: var(--text-faint);
      margin-top: 0.25rem;
      transition: color 0.15s;
    }
    .char-counter.warn  { color: var(--yellow); }
    .char-counter.limit { color: var(--red); }

    .form-row-inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    @media(max-width: 500px) {
      .form-row-inline { grid-template-columns: 1fr; }
    }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 0.25rem;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border: none;
      border-radius: var(--radius-sm);
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.55rem 1.1rem;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #0a0b0d;
    }
    .btn-primary:not(:disabled):hover {
      background: #d4ff6a;
      box-shadow: 0 0 14px rgba(192,247,72,0.35);
    }

    .btn-ghost {
      background: var(--bg4);
      color: var(--text-dim);
      border: 1px solid var(--border);
    }
    .btn-ghost:not(:disabled):hover { background: var(--bg3); color: var(--text); }

    .btn-yes {
      background: rgba(192,247,72,0.12);
      color: var(--accent);
      border: 1px solid rgba(192,247,72,0.25);
      font-size: 0.8rem;
      padding: 0.3rem 0.75rem;
    }
    .btn-yes:not(:disabled):hover { background: rgba(192,247,72,0.2); }

    .btn-no {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid rgba(255,77,106,0.25);
      font-size: 0.8rem;
      padding: 0.3rem 0.75rem;
    }
    .btn-no:not(:disabled):hover { background: rgba(255,77,106,0.2); }

    .btn-sm {
      font-size: 0.78rem;
      padding: 0.25rem 0.65rem;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(192,247,72,0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error / success banners ── */
    .inline-msg {
      font-size: 0.8rem;
      padding: 0.5rem 0.8rem;
      border-radius: var(--radius-sm);
      margin-top: 0.6rem;
    }
    .inline-msg.error   { background: var(--red-bg);   color: var(--red);    border: 1px solid rgba(255,77,106,0.25); }
    .inline-msg.success { background: var(--accent-bg); color: var(--accent); border: 1px solid rgba(192,247,72,0.2); }

    /* ── DAO panel ── */
    .dao-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media(max-width: 700px) { .dao-grid { grid-template-columns: 1fr; } }

    .params-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }
    .params-card h3 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      font-weight: 600;
      margin-bottom: 0.8rem;
    }
    .param-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.35rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.83rem;
    }
    .param-row:last-child { border-bottom: none; }
    .param-key { color: var(--text-dim); }
    .param-val { font-family: var(--mono); color: var(--accent); font-size: 0.8rem; font-weight: 600; }

    .proposals-section { margin-top: 1.5rem; }
    .proposals-section h3 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .proposal-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      margin-bottom: 0.6rem;
    }
    .proposal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.4rem;
    }
    .proposal-id {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text-faint);
    }
    .proposal-status {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.1rem 0.55rem;
      border-radius: 99px;
      white-space: nowrap;
    }
    .status-open   { background: var(--accent-bg); color: var(--accent); border: 1px solid rgba(192,247,72,0.2); }
    .status-closed { background: var(--bg4); color: var(--text-faint); border: 1px solid var(--border); }

    .proposal-reason {
      font-size: 0.88rem;
      color: var(--text);
      margin-bottom: 0.5rem;
      word-break: break-word;
    }
    .proposal-proposer {
      font-size: 0.75rem;
      color: var(--text-faint);
      font-family: var(--mono);
      margin-bottom: 0.6rem;
    }
    .proposal-vote-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .vote-label { font-size: 0.78rem; color: var(--text-dim); margin-right: 0.25rem; }
    .vote-counts { font-size: 0.75rem; color: var(--text-faint); margin-left: auto; }

    .propose-form {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-top: 1rem;
    }
    .propose-form h3 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    /* ── Stats card ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
    }
    .stat-val {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--mono);
      line-height: 1.1;
    }
    .stat-key {
      font-size: 0.75rem;
      color: var(--text-faint);
      margin-top: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── Voter ID input ── */
    #voter-id-wrap {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    #voter-id-wrap label { font-size: 0.8rem; color: var(--text-dim); font-weight: 600; white-space: nowrap; }
    #voter-id-input { flex: 1; min-width: 180px; font-size: 0.85rem; }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5rem 0;
    }

    /* ── Refresh button ── */
    #refresh-btn {
      font-size: 0.8rem;
      padding: 0.3rem 0.7rem;
    }

    /* ── Empty states ── */
    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-faint);
      font-size: 0.85rem;
    }

    /* ── Skeleton loader ── */
    .skeleton {
      background: linear-gradient(90deg, var(--bg3) 25%, var(--bg4) 50%, var(--bg3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-sm);
      height: 14px;
    }
    .skeleton-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── Tooltip ── */
    [title] { cursor: default; }

    /* ── Responsive ── */
    @media(max-width: 600px) {
      .page-shell { padding: 0 0.5rem 2rem; }
      #top-bar { margin: 0 -0.5rem; }
    }
  </style>
</head>
<body>

<!-- Top stats bar -->
<div id="top-bar">
  <div class="logo">MicroDAO <span>/ p2p micro-post</span></div>
  <div id="stats-text">
    <span id="stats-dot"></span>
    <span id="stats-count"> — posts live</span>
  </div>
  <div id="last-updated"></div>
</div>

<div class="page-shell">

  <!-- Nav tabs -->
  <nav id="main-nav">
    <button class="active" data-panel="feed">Live Feed</button>
    <button data-panel="publish">Publish</button>
    <button data-panel="dao">DAO Panel</button>
    <button data-panel="stats">Network Stats</button>
  </nav>

  <!-- ════════════════════════════════════════
       PANEL: LIVE FEED
  ════════════════════════════════════════ -->
  <div id="panel-feed" class="panel active">
    <div class="section-head">
      <h2>Live Feed <span id="feed-badge" class="badge">0</span></h2>
      <button id="refresh-btn" class="btn btn-ghost">↻ Refresh</button>
    </div>
    <div id="feed-msg"></div>
    <div id="feed-list">
      <!-- skeleton -->
      <div class="skeleton-card">
        <div class="skeleton" style="width:30%;margin-bottom:0.5rem"></div>
        <div class="skeleton" style="width:80%;margin-bottom:0.35rem"></div>
        <div class="skeleton" style="width:55%"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton" style="width:25%;margin-bottom:0.5rem"></div>
        <div class="skeleton" style="width:70%;margin-bottom:0.35rem"></div>
        <div class="skeleton" style="width:40%"></div>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       PANEL: PUBLISH
  ════════════════════════════════════════ -->
  <div id="panel-publish" class="panel">
    <div class="section-head">
      <h2>Publish Post</h2>
    </div>
    <div class="form-card">
      <form id="publish-form" autocomplete="off">

        <div class="form-row">
          <label for="pub-line1">Line 1 <span class="hint">required · max 140 chars</span></label>
          <input type="text" id="pub-line1" maxlength="140" placeholder="Your primary message…" required />
          <div class="char-counter" id="cc-line1">0 / 140</div>
        </div>

        <div class="form-row">
          <label for="pub-line2">Line 2 <span class="hint">optional · max 140 chars</span></label>
          <input type="text" id="pub-line2" maxlength="140" placeholder="Secondary line (optional)…" />
          <div class="char-counter" id="cc-line2">0 / 140</div>
        </div>

        <div class="form-row-inline">
          <div>
            <div class="form-row" style="margin-bottom:0">
              <label for="pub-author">Author DID / handle</label>
              <input type="text" id="pub-author" placeholder="did:key:z6Mk…" />
            </div>
          </div>
          <div>
            <div class="form-row" style="margin-bottom:0">
              <label for="pub-sig">Signature <span class="hint">optional</span></label>
              <input type="text" id="pub-sig" placeholder="base64url…" />
            </div>
          </div>
        </div>

        <div class="form-row" style="margin-top:1rem">
          <label for="pub-ttl">Expiry (TTL) <span class="hint">optional</span></label>
          <input type="datetime-local" id="pub-ttl" />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="pub-submit">
            <span id="pub-spinner" class="spinner" style="display:none"></span>
            Publish Post
          </button>
          <button type="button" class="btn btn-ghost" id="pub-clear">Clear</button>
        </div>

        <div id="pub-msg"></div>
      </form>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       PANEL: DAO
  ════════════════════════════════════════ -->
  <div id="panel-dao" class="panel">
    <div class="section-head">
      <h2>DAO Panel</h2>
      <button class="btn btn-ghost btn-sm" id="dao-refresh-btn">↻ Refresh</button>
    </div>

    <!-- Voter ID -->
    <div id="voter-id-wrap">
      <label for="voter-id-input">Your Voter ID (DID)</label>
      <input type="text" id="voter-id-input" placeholder="did:key:z6Mk… (used when casting votes)" />
    </div>

    <!-- DAO params + proposals grid -->
    <div class="dao-grid">
      <!-- Params -->
      <div>
        <div class="params-card">
          <h3>Current Parameters</h3>
          <div id="dao-params-content">
            <div class="skeleton" style="margin-bottom:0.5rem"></div>
            <div class="skeleton" style="width:80%;margin-bottom:0.5rem"></div>
            <div class="skeleton" style="width:60%"></div>
          </div>
        </div>
      </div>

      <!-- Propose -->
      <div>
        <div class="propose-form">
          <h3>Submit Proposal</h3>
          <form id="propose-form" autocomplete="off">
            <div class="form-row">
              <label for="prop-proposer">Proposer DID</label>
              <input type="text" id="prop-proposer" placeholder="did:key:z6Mk…" required />
            </div>
            <div class="form-row">
              <label for="prop-reason">Reason</label>
              <textarea id="prop-reason" placeholder="Describe your proposal reason…" rows="3" required></textarea>
            </div>
            <div class="form-row">
              <label for="prop-changes">Changes <span class="hint">JSON object</span></label>
              <textarea id="prop-changes" placeholder='{"maxLineLength": 200}' rows="3"></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="prop-submit">
                <span id="prop-spinner" class="spinner" style="display:none"></span>
                Submit Proposal
              </button>
            </div>
            <div id="prop-msg"></div>
          </form>
        </div>
      </div>
    </div>

    <!-- Proposals list -->
    <div class="proposals-section">
      <div class="section-head" style="margin-top:1rem">
        <h3>Open Proposals <span id="proposals-badge" class="badge">0</span></h3>
      </div>
      <div id="dao-msg"></div>
      <div id="proposals-list">
        <div class="skeleton-card" style="margin-bottom:0.6rem">
          <div class="skeleton" style="width:40%;margin-bottom:0.5rem"></div>
          <div class="skeleton" style="width:75%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       PANEL: NETWORK STATS
  ════════════════════════════════════════ -->
  <div id="panel-stats" class="panel">
    <div class="section-head">
      <h2>Network Stats</h2>
      <button class="btn btn-ghost btn-sm" id="stats-refresh-btn">↻ Refresh</button>
    </div>
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-val" id="sval-total">—</div>
        <div class="stat-key">Total Posts</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="sval-maxline">—</div>
        <div class="stat-key">Max Line Chars</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="sval-maxstored">—</div>
        <div class="stat-key">Max Stored Posts</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="sval-quorum">—</div>
        <div class="stat-key">Quorum Fraction</div>
      </div>
    </div>
    <div id="stats-msg"></div>
  </div>

</div><!-- /page-shell -->

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════════

function qs(sel, ctx) { return (ctx || document).querySelector(sel); }
function qsa(sel, ctx) { return Array.from((ctx || document).querySelectorAll(sel)); }

function relTime(ts) {
  const d = Date.now() - new Date(ts).getTime();
  if (d < 60000)  return 'just now';
  if (d < 3600000) return Math.floor(d / 60000) + 'm ago';
  if (d < 86400000) return Math.floor(d / 3600000) + 'h ago';
  return Math.floor(d / 86400000) + 'd ago';
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function fmtHMS() {
  return new Date().toLocaleTimeString(undefined, { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function truncDid(did) {
  if (!did) return 'anonymous';
  if (did.length <= 22) return did;
  return did.slice(0, 14) + '…' + did.slice(-6);
}

function showMsg(el, text, type) {
  if (!el) return;
  el.innerHTML = '';
  if (!text) return;
  const d = document.createElement('div');
  d.className = 'inline-msg ' + (type || 'error');
  d.textContent = text;
  el.appendChild(d);
}

function setLoading(btn, spinner, loading) {
  btn.disabled = loading;
  spinner.style.display = loading ? 'inline-block' : 'none';
}

// ═══════════════════════════════════════════════════════════════
//  API LAYER
// ═══════════════════════════════════════════════════════════════

async function apiFetch(path, opts) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...(opts && opts.headers) },
    ...opts
  });
  let json;
  try { json = await res.json(); } catch(e) { json = null; }
  if (!res.ok) {
    const msg = (json && (json.message || json.error)) || ('HTTP ' + res.status);
    throw new Error(msg);
  }
  return json;
}

const api = {
  getPosts:        ()          => apiFetch('/api/posts'),
  getPost:         (id)        => apiFetch('/api/posts/' + id),
  publishPost:     (body)      => apiFetch('/api/posts', { method: 'POST', body: JSON.stringify(body) }),
  anchorPost:      (id, body)  => apiFetch('/api/posts/' + id + '/anchor', { method: 'POST', body: JSON.stringify(body) }),
  getParams:       ()          => apiFetch('/api/posts/dao/params'),
  getProposals:    (status)    => apiFetch('/api/posts/dao/proposals' + (status ? '?status=' + status : '')),
  submitProposal:  (body)      => apiFetch('/api/posts/dao/propose', { method: 'POST', body: JSON.stringify(body) }),
  vote:            (id, body)  => apiFetch('/api/posts/dao/proposals/' + id + '/vote', { method: 'POST', body: JSON.stringify(body) }),
};

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════

const state = {
  posts: [],
  total: 0,
  params: null,
  proposals: [],
  expandedPost: null,
  refreshInterval: null,
};

// ═══════════════════════════════════════════════════════════════
//  NAV
// ═══════════════════════════════════════════════════════════════

qsa('#main-nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    qsa('#main-nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const panel = btn.dataset.panel;
    qsa('.panel').forEach(p => p.classList.remove('active'));
    qs('#panel-' + panel).classList.add('active');
    if (panel === 'dao') loadDao();
    if (panel === 'stats') loadStats();
  });
});

// ═══════════════════════════════════════════════════════════════
//  FEED
// ═══════════════════════════════════════════════════════════════

function renderPost(post) {
  const card = document.createElement('div');
  card.className = 'post-card';
  card.dataset.id = post.id;

  const anchor = post.ttl && post.ttl.chainAnchor;
  const expiresAt = post.ttl && post.ttl.expiresAt;

  card.innerHTML =
    '<div class="post-meta">' +
      '<span class="post-author" title="' + (post.author || '') + '">' + truncDid(post.author) + '</span>' +
      '<span class="post-ts">' + relTime(post.ts) + '</span>' +
      '<div class="post-badges">' +
        (expiresAt ? '<span class="badge badge-ttl">⏳ expires ' + fmtDate(expiresAt) + '</span>' : '') +
        (anchor    ? '<span class="badge badge-chain">⛓ ' + (anchor.network || 'chain') + '</span>' : '') +
      '</div>' +
    '</div>' +
    '<div class="post-line1">' + escHtml(post.line1) + '</div>' +
    (post.line2 ? '<div class="post-line2">' + escHtml(post.line2) + '</div>' : '') +
    '<div class="post-expand">' +
      '<div class="expand-label">Content hash (SHA-256)</div>' +
      '<div class="post-id">' + (post.id || '—') + '</div>' +
      (post.signature ? '<div class="expand-label" style="margin-top:0.5rem">Signature</div><div class="post-id">' + escHtml(post.signature) + '</div>' : '') +
      '<div style="font-size:0.75rem;color:var(--text-faint);margin-top:0.5rem">Published ' + new Date(post.ts).toLocaleString() + '</div>' +
    '</div>';

  card.addEventListener('click', () => {
    const wasOpen = card.classList.contains('expanded');
    qsa('.post-card.expanded').forEach(c => c.classList.remove('expanded'));
    if (!wasOpen) card.classList.add('expanded');
  });

  return card;
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadFeed(silent) {
  const list = qs('#feed-list');
  const msgEl = qs('#feed-msg');
  if (!silent) {
    list.innerHTML =
      '<div class="skeleton-card"><div class="skeleton" style="width:30%;margin-bottom:0.5rem"></div><div class="skeleton" style="width:80%;margin-bottom:0.35rem"></div><div class="skeleton" style="width:55%"></div></div>' +
      '<div class="skeleton-card"><div class="skeleton" style="width:25%;margin-bottom:0.5rem"></div><div class="skeleton" style="width:70%;margin-bottom:0.35rem"></div><div class="skeleton" style="width:40%"></div></div>';
  }
  try {
    const data = await api.getPosts();
    state.posts = data.posts || [];
    state.total = data.total || 0;

    list.innerHTML = '';
    if (state.posts.length === 0) {
      list.innerHTML = '<div class="feed-empty">No posts yet. Be the first to publish!</div>';
    } else {
      state.posts.forEach(p => list.appendChild(renderPost(p)));
    }

    qs('#feed-badge').textContent = state.total;
    updateTopBar();
    showMsg(msgEl, '', '');
  } catch(e) {
    showMsg(msgEl, 'Failed to load feed: ' + e.message, 'error');
  }
}

function updateTopBar() {
  qs('#stats-count').textContent = ' ' + state.total + ' post' + (state.total !== 1 ? 's' : '') + ' live';
  qs('#last-updated').textContent = 'updated ' + fmtHMS();
}

qs('#refresh-btn').addEventListener('click', () => loadFeed(false));

// auto-refresh every 5s
function startAutoRefresh() {
  if (state.refreshInterval) clearInterval(state.refreshInterval);
  state.refreshInterval = setInterval(() => {
    if (qs('#panel-feed').classList.contains('active')) {
      loadFeed(true);
    }
  }, 5000);
}

// ═══════════════════════════════════════════════════════════════
//  PUBLISH
// ═══════════════════════════════════════════════════════════════

function setupCharCounter(inputId, counterId, max) {
  const input  = qs('#' + inputId);
  const ctr    = qs('#' + counterId);
  function update() {
    const n = input.value.length;
    ctr.textContent = n + ' / ' + max;
    ctr.className = 'char-counter' + (n >= max ? ' limit' : n >= max * 0.8 ? ' warn' : '');
  }
  input.addEventListener('input', update);
  update();
}

setupCharCounter('pub-line1', 'cc-line1', 140);
setupCharCounter('pub-line2', 'cc-line2', 140);

qs('#pub-clear').addEventListener('click', () => {
  qs('#publish-form').reset();
  qs('#cc-line1').textContent = '0 / 140';
  qs('#cc-line1').className = 'char-counter';
  qs('#cc-line2').textContent = '0 / 140';
  qs('#cc-line2').className = 'char-counter';
  showMsg(qs('#pub-msg'), '', '');
});

qs('#publish-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn     = qs('#pub-submit');
  const spinner = qs('#pub-spinner');
  const msgEl   = qs('#pub-msg');

  const line1  = qs('#pub-line1').value.trim();
  const line2  = qs('#pub-line2').value.trim();
  const author = qs('#pub-author').value.trim();
  const sig    = qs('#pub-sig').value.trim();
  const ttlVal = qs('#pub-ttl').value;

  if (!line1) { showMsg(msgEl, 'Line 1 is required.', 'error'); return; }

  const body = {
    line1,
    author: author || 'anonymous',
    signature: sig || '',
    ts: new Date().toISOString(),
  };
  if (line2) body.line2 = line2;
  if (ttlVal) {
    const expiresAt = new Date(ttlVal).toISOString();
    body.ttl = { expiresAt };
  }

  setLoading(btn, spinner, true);
  showMsg(msgEl, '', '');

  try {
    const post = await api.publishPost(body);
    showMsg(msgEl, 'Post published successfully!', 'success');
    qs('#publish-form').reset();
    qs('#cc-line1').textContent = '0 / 140';
    qs('#cc-line1').className = 'char-counter';
    qs('#cc-line2').textContent = '0 / 140';
    qs('#cc-line2').className = 'char-counter';

    // Prepend to feed state and re-render top of list
    if (post && post.id) {
      state.posts.unshift(post);
      state.total += 1;
      const list = qs('#feed-list');
      const empty = list.querySelector('.feed-empty');
      if (empty) list.innerHTML = '';
      list.insertBefore(renderPost(post), list.firstChild);
      qs('#feed-badge').textContent = state.total;
      updateTopBar();
    }
  } catch(e) {
    showMsg(msgEl, 'Publish failed: ' + e.message, 'error');
  } finally {
    setLoading(btn, spinner, false);
  }
});

// ═══════════════════════════════════════════════════════════════
//  DAO PANEL
// ═══════════════════════════════════════════════════════════════

async function loadDao() {
  await Promise.all([loadParams(), loadProposals()]);
}

async function loadParams() {
  const el = qs('#dao-params-content');
  try {
    const p = await api.getParams();
    state.params = p;
    const rows = [
      ['maxLineLength',   p.maxLineLength],
      ['maxLines',        p.maxLines],
      ['requireTtl',      p.requireTtl ? 'yes' : 'no'],
      ['maxStoredPosts',  p.maxStoredPosts],
      ['quorumFraction',  p.quorumFraction],
      ['maxTtlMs',        p.maxTtlMs != null ? fmtMs(p.maxTtlMs) : '—'],
      ['minTtlMs',        p.minTtlMs != null ? fmtMs(p.minTtlMs) : '—'],
    ];
    el.innerHTML = rows.map(([k, v]) =>
      '<div class="param-row"><span class="param-key">' + k + '</span><span class="param-val">' + v + '</span></div>'
    ).join('');

    // Also update stats panel
    qs('#sval-maxline').textContent   = p.maxLineLength  != null ? p.maxLineLength  : '—';
    qs('#sval-maxstored').textContent = p.maxStoredPosts != null ? p.maxStoredPosts : '—';
    qs('#sval-quorum').textContent    = p.quorumFraction != null ? p.quorumFraction : '—';
  } catch(e) {
    el.innerHTML = '<div class="inline-msg error">Failed to load params: ' + escHtml(e.message) + '</div>';
  }
}

function fmtMs(ms) {
  if (ms == null) return '—';
  const s = ms / 1000;
  if (s < 60)   return s + 's';
  if (s < 3600) return (s/60).toFixed(0) + 'm';
  if (s < 86400) return (s/3600).toFixed(1) + 'h';
  return (s/86400).toFixed(1) + 'd';
}

async function loadProposals() {
  const list = qs('#proposals-list');
  const msgEl = qs('#dao-msg');
  try {
    const data = await api.getProposals('open');
    const proposals = Array.isArray(data) ? data : (data.proposals || []);
    state.proposals = proposals;
    qs('#proposals-badge').textContent = proposals.length;

    if (proposals.length === 0) {
      list.innerHTML = '<div class="empty-state">No open proposals at this time.</div>';
      return;
    }
    list.innerHTML = '';
    proposals.forEach(prop => list.appendChild(renderProposal(prop)));
    showMsg(msgEl, '', '');
  } catch(e) {
    showMsg(msgEl, 'Failed to load proposals: ' + e.message, 'error');
  }
}

function renderProposal(prop) {
  const card = document.createElement('div');
  card.className = 'proposal-card';
  card.dataset.propId = prop.id || prop._id || '';

  const status = prop.status || 'open';
  const yeas   = (prop.votes && prop.votes.yes)  || 0;
  const nays   = (prop.votes && prop.votes.no)   || 0;
  const changes = prop.changes ? JSON.stringify(prop.changes, null, 2) : '';

  card.innerHTML =
    '<div class="proposal-header">' +
      '<span class="proposal-id">' + escHtml(String(card.dataset.propId).slice(0,16)) + (String(card.dataset.propId).length > 16 ? '…' : '') + '</span>' +
      '<span class="proposal-status status-' + status + '">' + status.toUpperCase() + '</span>' +
    '</div>' +
    '<div class="proposal-reason">' + escHtml(prop.reason || '(no reason given)') + '</div>' +
    '<div class="proposal-proposer">Proposed by: ' + escHtml(truncDid(prop.proposer)) + '</div>' +
    (changes ? '<pre style="font-size:0.72rem;font-family:var(--mono);color:var(--text-dim);background:var(--bg4);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.4rem 0.6rem;margin-bottom:0.6rem;overflow:auto;white-space:pre-wrap;word-break:break-all">' + escHtml(changes) + '</pre>' : '') +
    '<div class="proposal-vote-row">' +
      '<span class="vote-label">Vote:</span>' +
      '<button class="btn btn-yes vote-btn" data-approve="true">✓ Yes</button>' +
      '<button class="btn btn-no vote-btn" data-approve="false">✗ No</button>' +
      '<span class="vote-counts">' + yeas + ' yes · ' + nays + ' no</span>' +
    '</div>' +
    '<div class="vote-msg"></div>';

  card.querySelectorAll('.vote-btn').forEach(vBtn => {
    vBtn.addEventListener('click', async () => {
      const approve = vBtn.dataset.approve === 'true';
      const voter   = qs('#voter-id-input').value.trim();
      const msgEl   = card.querySelector('.vote-msg');
      if (!voter) {
        showMsg(msgEl, 'Set your Voter ID (DID) at the top of the DAO panel before voting.', 'error');
        qs('#voter-id-input').focus();
        return;
      }
      const propId = card.dataset.propId;
      card.querySelectorAll('.vote-btn').forEach(b => b.disabled = true);
      showMsg(msgEl, '', '');
      try {
        await api.vote(propId, { voter, approve });
        showMsg(msgEl, 'Vote recorded! ' + (approve ? '✓ Yes' : '✗ No'), 'success');
        // Refresh proposals
        setTimeout(loadProposals, 800);
      } catch(e) {
        showMsg(msgEl, 'Vote failed: ' + e.message, 'error');
        card.querySelectorAll('.vote-btn').forEach(b => b.disabled = false);
      }
    });
  });

  return card;
}

qs('#dao-refresh-btn').addEventListener('click', () => loadDao());

// Propose form
qs('#propose-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn     = qs('#prop-submit');
  const spinner = qs('#prop-spinner');
  const msgEl   = qs('#prop-msg');

  const proposer = qs('#prop-proposer').value.trim();
  const reason   = qs('#prop-reason').value.trim();
  const changesRaw = qs('#prop-changes').value.trim();

  if (!proposer) { showMsg(msgEl, 'Proposer DID is required.', 'error'); return; }
  if (!reason)   { showMsg(msgEl, 'Reason is required.', 'error'); return; }

  let changes = {};
  if (changesRaw) {
    try { changes = JSON.parse(changesRaw); }
    catch(_) { showMsg(msgEl, 'Changes must be valid JSON.', 'error'); return; }
  }

  setLoading(btn, spinner, true);
  showMsg(msgEl, '', '');
  try {
    await api.submitProposal({ proposer, reason, changes });
    showMsg(msgEl, 'Proposal submitted!', 'success');
    qs('#propose-form').reset();
    setTimeout(loadProposals, 600);
  } catch(e) {
    showMsg(msgEl, 'Proposal failed: ' + e.message, 'error');
  } finally {
    setLoading(btn, spinner, false);
  }
});

// ═══════════════════════════════════════════════════════════════
//  STATS PANEL
// ═══════════════════════════════════════════════════════════════

async function loadStats() {
  const msgEl = qs('#stats-msg');
  try {
    const [feedData, paramsData] = await Promise.all([api.getPosts(), api.getParams()]);
    const total = feedData.total || 0;
    state.total = total;
    qs('#sval-total').textContent     = total;
    qs('#sval-maxline').textContent   = paramsData.maxLineLength  != null ? paramsData.maxLineLength  : '—';
    qs('#sval-maxstored').textContent = paramsData.maxStoredPosts != null ? paramsData.maxStoredPosts : '—';
    qs('#sval-quorum').textContent    = paramsData.quorumFraction != null ? paramsData.quorumFraction : '—';
    updateTopBar();
    showMsg(msgEl, '', '');
  } catch(e) {
    showMsg(msgEl, 'Failed to load stats: ' + e.message, 'error');
  }
}

qs('#stats-refresh-btn').addEventListener('click', () => loadStats());

// ═══════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════

(async function init() {
  await loadFeed(false);
  startAutoRefresh();
})();
</script>
</body>
</html>
