<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOLGANG RTS - Chemical Plant Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080c18;color:#e0e0e0;font-family:'Segoe UI',sans-serif;overflow:hidden;user-select:none}
canvas{display:block}

/* TOP BAR */
#topbar{position:fixed;top:0;left:0;right:0;height:40px;background:rgba(8,12,24,0.95);border-bottom:1px solid #1a2a44;display:flex;align-items:center;padding:0 12px;z-index:20;gap:16px}
#topbar .logo{font-weight:700;font-size:.9em;background:linear-gradient(90deg,#60a5fa,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.res{display:flex;align-items:center;gap:4px;font-size:.75em;padding:3px 10px;background:rgba(30,58,95,0.3);border-radius:12px;border:1px solid #1a2a44}
.res .rv{font-weight:700}
.res .rv.mol{color:#fbbf24}.res .rv.atom{color:#60a5fa}.res .rv.fert{color:#22c55e}.res .rv.pow{color:#f59e0b}.res .rv.wrk{color:#a855f7}
#topbar .spacer{flex:1}
#topbar a{color:#60a5fa;font-size:.75em;text-decoration:none}

/* RIGHT PANEL */
#rpanel{position:fixed;top:40px;right:0;width:260px;bottom:0;background:rgba(8,12,24,0.95);border-left:1px solid #1a2a44;z-index:15;overflow-y:auto;font-size:.8em}
.panel-tab{display:flex;border-bottom:1px solid #1a2a44}
.ptab{flex:1;padding:8px 4px;text-align:center;cursor:pointer;color:#94a3b8;font-size:.75em;border-bottom:2px solid transparent;transition:all .2s}
.ptab:hover{color:#60a5fa}.ptab.active{color:#60a5fa;border-bottom-color:#60a5fa}
.panel-content{padding:10px;display:none}
.panel-content.active{display:block}

/* Build panel */
.build-item{padding:8px;background:rgba(30,58,95,0.2);border:1px solid #1a2a44;border-radius:6px;margin-bottom:6px;cursor:pointer;transition:all .2s}
.build-item:hover{border-color:#60a5fa;background:rgba(96,165,250,0.1)}
.build-item.cant{opacity:.4;cursor:not-allowed}
.build-item .bi-name{font-weight:600;margin-bottom:2px}
.build-item .bi-cost{font-size:.75em;color:#94a3b8}
.build-item .bi-desc{font-size:.7em;color:#64748b;margin-top:2px}

/* Research panel */
.research-item{padding:8px;background:rgba(30,58,95,0.2);border:1px solid #1a2a44;border-radius:6px;margin-bottom:6px;cursor:pointer;transition:all .2s}
.research-item:hover{border-color:#a855f7}
.research-item.done{border-color:#22c55e;opacity:.6}
.research-item.active{border-color:#f59e0b;animation:pulse 2s infinite}
.research-item .ri-name{font-weight:600}
.research-item .ri-cost{font-size:.75em;color:#94a3b8}
.research-item .ri-time{font-size:.7em;color:#f59e0b}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

/* Production queue */
.prod-slot{padding:6px 8px;background:rgba(30,58,95,0.2);border:1px solid #1a2a44;border-radius:4px;margin-bottom:4px;display:flex;align-items:center;gap:6px;font-size:.75em}
.prod-slot .pbar{flex:1;height:4px;background:rgba(30,58,95,0.4);border-radius:2px;overflow:hidden}
.prod-slot .pfill{height:100%;background:#60a5fa;transition:width .3s}

/* BOTTOM BAR (selected building info) */
#bottombar{position:fixed;bottom:0;left:0;right:260px;height:80px;background:rgba(8,12,24,0.95);border-top:1px solid #1a2a44;z-index:15;padding:8px 12px;display:none}
#bottombar .bb-name{font-weight:700;color:#60a5fa;margin-bottom:4px}
#bottombar .bb-info{font-size:.75em;color:#94a3b8}
#bottombar .bb-actions{display:flex;gap:6px;margin-top:6px}
.bb-btn{padding:4px 12px;background:rgba(30,58,95,0.3);border:1px solid #1a2a44;border-radius:4px;color:#60a5fa;cursor:pointer;font-size:.75em}
.bb-btn:hover{border-color:#60a5fa;background:rgba(96,165,250,0.1)}
.bb-btn.danger{color:#ef4444;border-color:#ef4444}

/* Toast */
#toast{position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:30;pointer-events:none}
.tmsg{padding:5px 16px;background:rgba(34,197,94,0.85);color:white;border-radius:12px;font-size:.75em;font-weight:600;margin-bottom:3px;animation:tin .3s,tout .4s 2s forwards;white-space:nowrap}
.tmsg.w{background:rgba(245,158,11,0.85)}.tmsg.i{background:rgba(96,165,250,0.85)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
@keyframes tout{to{opacity:0}}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <span class="logo">⚗️ MOLGANG RTS</span>
  <div class="res">💰 <span class="rv mol" id="r-mol">500</span> $MOL</div>
  <div class="res">⚛️ <span class="rv atom" id="r-atoms">0</span> Atoms</div>
  <div class="res">⚗️ <span class="rv fert" id="r-fert">0</span> Molecules</div>
  <div class="res">⚡ <span class="rv pow" id="r-power">10</span> Power</div>
  <div class="res">👷 <span class="rv wrk" id="r-workers">5</span>/<span id="r-maxw">5</span> Workers</div>
  <span class="spacer"></span>
  <a href="/game">🎮 3D Mode</a>
  <a href="/">📊 Dashboard</a>
</div>

<!-- RIGHT PANEL -->
<div id="rpanel">
  <div class="panel-tab">
    <div class="ptab active" onclick="switchTab('build')">🏗️ Build</div>
    <div class="ptab" onclick="switchTab('research')">🔬 Research</div>
    <div class="ptab" onclick="switchTab('production')">⚙️ Queue</div>
  </div>
  <div class="panel-content active" id="tab-build"></div>
  <div class="panel-content" id="tab-research"></div>
  <div class="panel-content" id="tab-production"></div>
</div>

<!-- BOTTOM BAR -->
<div id="bottombar">
  <div class="bb-name" id="bb-name"></div>
  <div class="bb-info" id="bb-info"></div>
  <div class="bb-actions" id="bb-actions"></div>
</div>

<!-- GAME CANVAS -->
<canvas id="c"></canvas>
<div id="toast"></div>

<script>
// ================================================================
// MOLGANG RTS ENGINE — Red Alert / C&C Generals style
// Isometric grid, building placement, production, research, workers
// ================================================================

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W, H;
function resize(){
  W = cvs.width = window.innerWidth - 260;
  H = cvs.height = window.innerHeight - 40;
}
resize();
window.addEventListener('resize', resize);

// === GRID ===
const TILE = 48; // pixel size of one grid cell
const GRID_W = 40, GRID_H = 40;
const grid = []; // grid[y][x] = null or buildingRef
for(let y=0;y<GRID_H;y++){grid[y]=[];for(let x=0;x<GRID_W;x++)grid[y][x]=null}

// Camera (scroll with WASD/arrows, zoom with wheel)
let cam = {x:GRID_W*TILE/2 - 400, y:GRID_H*TILE/2 - 300, zoom:1};
let keys={};
document.addEventListener('keydown',e=>{keys[e.code]=true});
document.addEventListener('keyup',e=>{keys[e.code]=false});
cvs.addEventListener('wheel',e=>{
  cam.zoom = Math.max(0.4, Math.min(2, cam.zoom - e.deltaY*0.001));
  e.preventDefault();
},{passive:false});

// === RESOURCES ===
const R = {mol:500, atoms:0, molecules:0, power:10, powerUsed:0, workers:5, maxWorkers:5, fert:0};

// === BUILDING TYPES ===
const BTYPES = {
  hq:       {name:'Command Center',icon:'🏛️',w:3,h:3,cost:0,power:0,color:'#1e40af',desc:'Your base of operations',produces:null,maxWorkers:0},
  mine:     {name:'Atom Mine',icon:'⛏️',w:2,h:2,cost:100,power:2,color:'#713f12',desc:'Mines raw atoms from the ground',produces:'atoms',rate:1,maxWorkers:3},
  lab:      {name:'Chemistry Lab',icon:'⚗️',w:2,h:2,cost:150,power:3,color:'#1e3a5f',desc:'Synthesize molecules from atoms',produces:'molecules',rate:0.5,maxWorkers:2},
  factory:  {name:'Fertilizer Plant',icon:'🏭',w:3,h:2,cost:250,power:5,color:'#4a2810',desc:'Produces fertilizer from molecules',produces:'fertilizer',rate:0.3,maxWorkers:3},
  powerplant:{name:'Power Station',icon:'⚡',w:2,h:2,cost:200,power:-8,color:'#854d0e',desc:'Generates 8 power for your base',produces:null,maxWorkers:1},
  barracks: {name:'Worker Housing',icon:'🏠',w:2,h:2,cost:150,power:1,color:'#365314',desc:'Houses 5 additional workers',produces:null,maxWorkers:0,workerBonus:5},
  research: {name:'Research Center',icon:'🔬',w:2,h:2,cost:300,power:4,color:'#4c1d95',desc:'Unlocks advanced recipes and upgrades',produces:null,maxWorkers:2},
  market:   {name:'Market Exchange',icon:'📊',w:2,h:2,cost:200,power:2,color:'#581c87',desc:'Auto-sells excess molecules for $MOL',produces:'mol',rate:0.2,maxWorkers:1},
  silo:     {name:'Storage Silo',icon:'🏗️',w:1,h:1,cost:50,power:0,color:'#1e3a3f',desc:'Increases storage capacity',produces:null,maxWorkers:0},
  wall:     {name:'Wall',icon:'🧱',w:1,h:1,cost:10,power:0,color:'#374151',desc:'Perimeter wall section',produces:null,maxWorkers:0},
};

// === RESEARCH TREE ===
const RESEARCH = [
  {id:'r1',name:'Basic Chemistry',desc:'Unlock Chemistry Lab',cost:0,time:0,done:true,unlocks:['lab']},
  {id:'r2',name:'Molecular Synthesis',desc:'2x molecule production speed',cost:100,time:30,done:false,unlocks:[],effect:'mol_speed',requires:['r1']},
  {id:'r3',name:'Fertilizer Science',desc:'Unlock Fertilizer Plant',cost:200,time:45,done:false,unlocks:['factory'],requires:['r2']},
  {id:'r4',name:'Power Engineering',desc:'Power stations produce +4 power',cost:150,time:30,done:false,unlocks:[],effect:'power_boost',requires:['r1']},
  {id:'r5',name:'Advanced Mining',desc:'Mines produce 2x atoms',cost:200,time:40,done:false,unlocks:[],effect:'mine_speed',requires:['r1']},
  {id:'r6',name:'Market Economics',desc:'Unlock Market Exchange',cost:250,time:50,done:false,unlocks:['market'],requires:['r2']},
  {id:'r7',name:'NPK Optimization',desc:'Fertilizer plants 2x speed',cost:300,time:60,done:false,unlocks:[],effect:'fert_speed',requires:['r3']},
  {id:'r8',name:'Worker Automation',desc:'Buildings need 1 fewer worker',cost:400,time:80,done:false,unlocks:[],effect:'auto_worker',requires:['r5']},
  {id:'r9',name:'Rare Elements',desc:'Mines can find Fe, S, Ca, Na, K',cost:350,time:60,done:false,unlocks:[],effect:'rare_elements',requires:['r5']},
  {id:'r10',name:'Quantum Chemistry',desc:'Unlock legendary molecule synthesis',cost:500,time:120,done:false,unlocks:[],effect:'legendary',requires:['r6','r7']},
];
let activeResearch = null;
let researchProgress = 0;

// === BUILDINGS (placed) ===
let buildings = [];
let nextBuildId = 1;

// === WORKERS ===
let workers = [];
let nextWorkerId = 1;

function spawnWorker(x, y) {
  workers.push({
    id: nextWorkerId++,
    x: x * TILE + TILE/2,
    y: y * TILE + TILE/2,
    tx: null, ty: null, // target
    assignedTo: null, // building id
    state: 'idle', // idle, walking, working
    speed: 1.5,
    frame: 0,
  });
}

// === PRODUCTION QUEUE ===
let prodQueue = []; // {buildingId, product, progress, total}

// === PLACE INITIAL HQ ===
function placeHQ() {
  const hx = Math.floor(GRID_W/2)-1, hy = Math.floor(GRID_H/2)-1;
  placeBuilding('hq', hx, hy);
  // Spawn initial workers around HQ
  for(let i=0;i<5;i++) spawnWorker(hx+1+Math.floor(Math.random()*3), hy+3+Math.floor(Math.random()*2));
  // Center camera
  cam.x = hx*TILE - W/2 + 72;
  cam.y = hy*TILE - H/2 + 72;
}

function placeBuilding(type, gx, gy) {
  const bt = BTYPES[type];
  if(!bt) return false;
  // Check grid is empty
  for(let dy=0;dy<bt.h;dy++)for(let dx=0;dx<bt.w;dx++){
    if(gx+dx>=GRID_W||gy+dy>=GRID_H||grid[gy+dy][gx+dx]) return false;
  }
  // Check cost
  if(R.mol < bt.cost){toast('Not enough $MOL!','w');return false}
  // Check power
  const powerAfter = R.powerUsed + bt.power;
  const totalPower = R.power + (bt.power < 0 ? -bt.power : 0);
  if(bt.power > 0 && powerAfter > R.power){toast('Not enough power! Build a Power Station.','w');return false}

  R.mol -= bt.cost;
  if(bt.power < 0) R.power += (-bt.power); else R.powerUsed += bt.power;
  if(bt.workerBonus) {R.maxWorkers += bt.workerBonus; for(let i=0;i<bt.workerBonus;i++)spawnWorker(gx+Math.random()*bt.w,gy+bt.h)}

  const b = {id:nextBuildId++, type, gx, gy, bt, assignedWorkers:0, hp:100, active:true, productionTimer:0};
  buildings.push(b);
  for(let dy=0;dy<bt.h;dy++)for(let dx=0;dx<bt.w;dx++) grid[gy+dy][gx+dx]=b;

  toast(`Built ${bt.name}!`);
  autoAssignWorkers();
  return true;
}

// === WORKER AI ===
function autoAssignWorkers() {
  // Unassign all
  for(const w of workers) {w.assignedTo=null;w.state='idle'}
  for(const b of buildings) b.assignedWorkers=0;

  // Assign workers to buildings that need them
  const needsWorkers = buildings.filter(b=>b.bt.maxWorkers>0 && b.active).sort((a,b)=>{
    const pri = {mine:1,lab:2,factory:3,powerplant:4,research:5,market:6};
    return (pri[a.type]||9)-(pri[b.type]||9);
  });

  let available = [...workers];
  for(const b of needsWorkers) {
    let needed = b.bt.maxWorkers;
    if(RESEARCH.find(r=>r.id==='r8'&&r.done)) needed = Math.max(1, needed-1); // automation research
    for(let i=0;i<needed&&available.length>0;i++){
      const w = available.shift();
      w.assignedTo = b.id;
      w.tx = b.gx*TILE + b.bt.w*TILE/2 + (Math.random()-0.5)*TILE;
      w.ty = b.gy*TILE + b.bt.h*TILE/2 + (Math.random()-0.5)*TILE;
      w.state = 'walking';
      b.assignedWorkers++;
    }
  }
}

function updateWorkers(dt) {
  for(const w of workers) {
    if(w.state==='walking' && w.tx!==null) {
      const dx=w.tx-w.x, dy=w.ty-w.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<3){w.state='working';w.tx=null;w.ty=null}
      else{w.x+=dx/dist*w.speed;w.y+=dy/dist*w.speed}
    }
    w.frame+=dt*3;
    // Idle workers wander slightly
    if(w.state==='idle'&&Math.random()<0.005){
      w.tx=w.x+(Math.random()-0.5)*60;
      w.ty=w.y+(Math.random()-0.5)*60;
      w.state='walking';
    }
  }
}

// === PRODUCTION TICK ===
function productionTick(dt) {
  for(const b of buildings) {
    if(!b.active || !b.bt.produces || b.assignedWorkers===0) continue;
    let rate = b.bt.rate * b.assignedWorkers * dt;

    // Research bonuses
    if(b.type==='mine'&&RESEARCH.find(r=>r.id==='r5'&&r.done)) rate*=2;
    if(b.type==='lab'&&RESEARCH.find(r=>r.id==='r2'&&r.done)) rate*=2;
    if(b.type==='factory'&&RESEARCH.find(r=>r.id==='r7'&&r.done)) rate*=2;

    if(b.bt.produces==='atoms') R.atoms+=rate;
    if(b.bt.produces==='molecules'&&R.atoms>=rate*5){R.atoms-=rate*5;R.molecules+=rate}
    if(b.bt.produces==='fertilizer'&&R.molecules>=rate*3){R.molecules-=rate*3;R.fert+=rate}
    if(b.bt.produces==='mol'&&R.molecules>=rate*2){R.molecules-=rate*2;R.mol+=rate*10}
  }

  // Research progress
  if(activeResearch) {
    const rc = buildings.find(b=>b.type==='research'&&b.assignedWorkers>0);
    if(rc) {
      researchProgress += dt * rc.assignedWorkers;
      if(researchProgress >= activeResearch.time) {
        activeResearch.done = true;
        toast(`🔬 Researched: ${activeResearch.name}!`);
        activeResearch = null;
        researchProgress = 0;
        renderResearchTab();
      }
    }
  }
}

// === MOUSE ===
let mouse = {x:0,y:0,gx:0,gy:0,down:false};
let placingType = null; // building type being placed
let selectedBuilding = null;

cvs.addEventListener('mousemove',e=>{
  const rect=cvs.getBoundingClientRect();
  mouse.x=e.clientX-rect.left;
  mouse.y=e.clientY-rect.top;
  mouse.gx=Math.floor((mouse.x/cam.zoom+cam.x)/TILE);
  mouse.gy=Math.floor((mouse.y/cam.zoom+cam.y)/TILE);
});

cvs.addEventListener('mousedown',e=>{
  mouse.down=true;
  if(placingType){
    if(placeBuilding(placingType, mouse.gx, mouse.gy)){
      if(!keys['ShiftLeft'])placingType=null;
      renderBuildTab();
    }
    return;
  }
  // Select building
  if(mouse.gx>=0&&mouse.gx<GRID_W&&mouse.gy>=0&&mouse.gy<GRID_H){
    const b = grid[mouse.gy]?.[mouse.gx];
    if(b){selectBuilding(b)}
    else{selectedBuilding=null;document.getElementById('bottombar').style.display='none'}
  }
});
cvs.addEventListener('mouseup',()=>{mouse.down=false});
cvs.addEventListener('contextmenu',e=>{e.preventDefault();placingType=null});

function selectBuilding(b) {
  selectedBuilding=b;
  const bb=document.getElementById('bottombar');
  bb.style.display='block';
  document.getElementById('bb-name').textContent=`${b.bt.icon} ${b.bt.name}`;
  document.getElementById('bb-info').textContent=`Workers: ${b.assignedWorkers}/${b.bt.maxWorkers} | Power: ${b.bt.power} | ${b.bt.desc}`;
  document.getElementById('bb-actions').innerHTML=`
    ${b.bt.produces?`<div class="bb-btn" onclick="boostBuilding(${b.id})">⚡ Boost</div>`:''}
    ${b.type!=='hq'?`<div class="bb-btn danger" onclick="sellBuilding(${b.id})">💰 Sell (${Math.floor(b.bt.cost/2)})</div>`:''}
  `;
}

window.sellBuilding = function(id) {
  const idx=buildings.findIndex(b=>b.id===id);
  if(idx<0)return;
  const b=buildings[idx];
  for(let dy=0;dy<b.bt.h;dy++)for(let dx=0;dx<b.bt.w;dx++)grid[b.gy+dy][b.gx+dx]=null;
  R.mol+=Math.floor(b.bt.cost/2);
  if(b.bt.power<0)R.power-=(-b.bt.power);else R.powerUsed-=b.bt.power;
  if(b.bt.workerBonus)R.maxWorkers-=b.bt.workerBonus;
  buildings.splice(idx,1);
  selectedBuilding=null;
  document.getElementById('bottombar').style.display='none';
  toast(`Sold ${b.bt.name} for ${Math.floor(b.bt.cost/2)} $MOL`);
  autoAssignWorkers();
  renderBuildTab();
};

window.boostBuilding = function(id) {
  const b=buildings.find(x=>x.id===id);
  if(!b||R.mol<50)return;
  R.mol-=50;
  // Instant production burst
  if(b.bt.produces==='atoms')R.atoms+=20;
  if(b.bt.produces==='molecules')R.molecules+=10;
  if(b.bt.produces==='fertilizer')R.fert+=5;
  toast(`⚡ Boosted ${b.bt.name}!`);
};

// === UI TABS ===
function switchTab(tab) {
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel-content').forEach(p=>p.classList.remove('active'));
  document.querySelector(`.ptab[onclick="switchTab('${tab}')"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
  if(tab==='build')renderBuildTab();
  if(tab==='research')renderResearchTab();
  if(tab==='production')renderProductionTab();
}

function renderBuildTab() {
  const unlockedTypes = new Set(['mine','powerplant','barracks','silo','wall','hq']);
  for(const r of RESEARCH){if(r.done&&r.unlocks)r.unlocks.forEach(u=>unlockedTypes.add(u))}
  // Always show lab if r1 done
  if(RESEARCH[0].done)unlockedTypes.add('lab');

  const tab=document.getElementById('tab-build');
  tab.innerHTML=Object.entries(BTYPES).filter(([k])=>k!=='hq'&&unlockedTypes.has(k)).map(([k,bt])=>{
    const can=R.mol>=bt.cost&&(bt.power<=0||R.powerUsed+bt.power<=R.power);
    return `<div class="build-item${can?'':' cant'}" onclick="${can?`startPlace('${k}')`:''}" ${can?'':'title="Cannot afford or no power"'}>
      <div class="bi-name">${bt.icon} ${bt.name}</div>
      <div class="bi-cost">💰 ${bt.cost} $MOL | ⚡ ${bt.power>0?'+':''}${bt.power} power${bt.workerBonus?' | 👷 +'+bt.workerBonus+' workers':''}</div>
      <div class="bi-desc">${bt.desc}</div>
    </div>`;
  }).join('');
}

function renderResearchTab() {
  const tab=document.getElementById('tab-research');
  tab.innerHTML=RESEARCH.map(r=>{
    const reqs=r.requires?r.requires.every(id=>RESEARCH.find(x=>x.id===id)?.done):true;
    const isActive=activeResearch&&activeResearch.id===r.id;
    const cls=r.done?'done':isActive?'active':!reqs?'cant':'';
    return `<div class="research-item ${cls}" onclick="${!r.done&&reqs&&!isActive?`startResearch('${r.id}')`:''}">
      <div class="ri-name">${r.done?'✅':'🔬'} ${r.name}</div>
      <div class="ri-cost">💰 ${r.cost} $MOL${r.requires?' | Requires: '+r.requires.join(', '):''}</div>
      ${isActive?`<div class="ri-time">⏳ ${Math.floor(researchProgress)}/${r.time}s</div>`:`<div class="ri-time">⏱️ ${r.time}s${r.done?' — DONE':''}</div>`}
      <div class="bi-desc">${r.desc}</div>
    </div>`;
  }).join('');
}

function renderProductionTab() {
  const tab=document.getElementById('tab-production');
  const producing=buildings.filter(b=>b.bt.produces&&b.assignedWorkers>0);
  if(producing.length===0){tab.innerHTML='<p style="color:#94a3b8;padding:8px">No active production. Build mines and labs, then assign workers.</p>';return}
  tab.innerHTML=producing.map(b=>{
    const output={atoms:'⚛️ Atoms',molecules:'⚗️ Molecules',fertilizer:'🌾 Fertilizer',mol:'💰 $MOL'}[b.bt.produces];
    return `<div class="prod-slot">
      <span>${b.bt.icon}</span>
      <span style="flex:1">${b.bt.name} → ${output}</span>
      <span style="color:#22c55e">👷${b.assignedWorkers}</span>
    </div>`;
  }).join('') + (activeResearch?`<div class="prod-slot" style="border-color:#a855f7">
    <span>🔬</span><span style="flex:1">${activeResearch.name}</span>
    <div class="pbar"><div class="pfill" style="width:${(researchProgress/activeResearch.time*100)}%;background:#a855f7"></div></div>
  </div>`:'');
}

window.startPlace = function(type){placingType=type;toast(`Click grid to place ${BTYPES[type].name}. Right-click to cancel.`,'i')};
window.startResearch = function(id){
  const r=RESEARCH.find(x=>x.id===id);
  if(!r||r.done)return;
  if(!buildings.some(b=>b.type==='research')){toast('Build a Research Center first!','w');return}
  if(R.mol<r.cost){toast('Not enough $MOL!','w');return}
  R.mol-=r.cost;
  activeResearch=r;researchProgress=0;
  toast(`🔬 Researching: ${r.name}`,'i');
  renderResearchTab();
};

// === RENDER ===
function render() {
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.scale(cam.zoom,cam.zoom);
  ctx.translate(-cam.x,-cam.y);

  // Grid
  ctx.strokeStyle='#0d1f3c';ctx.lineWidth=0.5;
  for(let x=0;x<=GRID_W;x++){ctx.beginPath();ctx.moveTo(x*TILE,0);ctx.lineTo(x*TILE,GRID_H*TILE);ctx.stroke()}
  for(let y=0;y<=GRID_H;y++){ctx.beginPath();ctx.moveTo(0,y*TILE);ctx.lineTo(GRID_W*TILE,y*TILE);ctx.stroke()}

  // Terrain tint (darker edges)
  for(let y=0;y<GRID_H;y++)for(let x=0;x<GRID_W;x++){
    const edgeDist=Math.min(x,y,GRID_W-1-x,GRID_H-1-y);
    if(edgeDist<3){ctx.fillStyle=`rgba(0,0,0,${0.3-edgeDist*0.1})`;ctx.fillRect(x*TILE,y*TILE,TILE,TILE)}
  }

  // Buildings
  for(const b of buildings) {
    const bx=b.gx*TILE, by=b.gy*TILE, bw=b.bt.w*TILE, bh=b.bt.h*TILE;
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.fillRect(bx+3,by+3,bw,bh);
    // Body
    ctx.fillStyle=b.bt.color;
    ctx.fillRect(bx,by,bw,bh);
    // Border
    ctx.strokeStyle=selectedBuilding&&selectedBuilding.id===b.id?'#60a5fa':'rgba(255,255,255,0.15)';
    ctx.lineWidth=selectedBuilding&&selectedBuilding.id===b.id?2:1;
    ctx.strokeRect(bx,by,bw,bh);
    // Icon
    ctx.font=`${Math.min(bw,bh)*0.5}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(b.bt.icon,bx+bw/2,by+bh/2);
    // Name
    ctx.font='9px sans-serif';ctx.fillStyle='#e0e0e0';
    ctx.fillText(b.bt.name,bx+bw/2,by+bh-6);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
    // Worker count
    if(b.assignedWorkers>0){
      ctx.fillStyle='rgba(34,197,94,0.8)';ctx.font='bold 10px sans-serif';
      ctx.fillText(`👷${b.assignedWorkers}`,bx+2,by+12);
    }
  }

  // Placement ghost
  if(placingType&&mouse.gx>=0&&mouse.gx<GRID_W&&mouse.gy>=0&&mouse.gy<GRID_H){
    const bt=BTYPES[placingType];
    let canPlace=true;
    for(let dy=0;dy<bt.h;dy++)for(let dx=0;dx<bt.w;dx++){
      if(mouse.gx+dx>=GRID_W||mouse.gy+dy>=GRID_H||grid[mouse.gy+dy]?.[mouse.gx+dx])canPlace=false;
    }
    ctx.globalAlpha=0.5;
    ctx.fillStyle=canPlace?'#22c55e':'#ef4444';
    ctx.fillRect(mouse.gx*TILE,mouse.gy*TILE,bt.w*TILE,bt.h*TILE);
    ctx.font=`${Math.min(bt.w,bt.h)*TILE*0.4}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';
    ctx.fillText(bt.icon,mouse.gx*TILE+bt.w*TILE/2,mouse.gy*TILE+bt.h*TILE/2);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
    ctx.globalAlpha=1;
  }

  // Workers
  for(const w of workers) {
    const bobY = w.state==='working' ? Math.sin(w.frame)*1.5 : 0;
    // Body
    ctx.fillStyle=w.state==='working'?'#22c55e':w.state==='walking'?'#f59e0b':'#94a3b8';
    ctx.beginPath();ctx.arc(w.x,w.y+bobY,4,0,Math.PI*2);ctx.fill();
    // Head
    ctx.fillStyle='#ffcc88';
    ctx.beginPath();ctx.arc(w.x,w.y-5+bobY,3,0,Math.PI*2);ctx.fill();
    // Hard hat
    ctx.fillStyle='#fbbf24';
    ctx.fillRect(w.x-3.5,w.y-9+bobY,7,2);
  }

  ctx.restore();

  // Update resource display
  document.getElementById('r-mol').textContent=Math.floor(R.mol);
  document.getElementById('r-atoms').textContent=Math.floor(R.atoms);
  document.getElementById('r-fert').textContent=Math.floor(R.molecules);
  document.getElementById('r-power').textContent=`${R.powerUsed}/${R.power}`;
  document.getElementById('r-workers').textContent=workers.filter(w=>w.assignedTo).length;
  document.getElementById('r-maxw').textContent=R.maxWorkers;
}

// === GAME LOOP ===
let lastTime=0;
function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  const dt=Math.min((time-lastTime)/1000,0.1);
  lastTime=time;

  // Camera movement
  const camSpeed=300*dt/cam.zoom;
  if(keys['KeyW']||keys['ArrowUp'])cam.y-=camSpeed;
  if(keys['KeyS']||keys['ArrowDown'])cam.y+=camSpeed;
  if(keys['KeyA']||keys['ArrowLeft'])cam.x-=camSpeed;
  if(keys['KeyD']||keys['ArrowRight'])cam.x+=camSpeed;

  productionTick(dt);
  updateWorkers(dt);
  render();

  // Update production tab if visible
  if(document.getElementById('tab-production').classList.contains('active'))renderProductionTab();
  if(document.getElementById('tab-research').classList.contains('active')&&activeResearch)renderResearchTab();
}

function toast(m,t){const e=document.createElement('div');e.className='tmsg'+(t?' '+t:'');e.textContent=m;document.getElementById('toast').appendChild(e);setTimeout(()=>e.remove(),2500)}

// === INIT ===
placeHQ();
renderBuildTab();
renderResearchTab();
renderProductionTab();
requestAnimationFrame(gameLoop);

toast('Welcome to MOLGANG RTS! Build mines, labs, and factories.','i');
setTimeout(()=>toast('WASD to scroll, mouse wheel to zoom, click to place/select','i'),3000);
</script>
