<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Alexander technical arbiter mark">
  <title>Alexander</title>
  <defs>
    <linearGradient id="alexG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="alexBlade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#9ca3af"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="60" fill="#0a0e1a" stroke="url(#alexG)" stroke-width="3"/>
  <!-- vertical sword/blade running through the disc -->
  <path d="M62 14 L66 14 L68 78 L60 78 Z" fill="url(#alexBlade)" stroke="#fca5a5" stroke-width="0.75"/>
  <!-- crossguard -->
  <rect x="38" y="76" width="52" height="6" rx="1.5" fill="url(#alexG)"/>
  <!-- handle grip -->
  <rect x="58" y="82" width="12" height="22" rx="2" fill="#1f2937" stroke="url(#alexG)" stroke-width="1.5"/>
  <!-- pommel -->
  <circle cx="64" cy="110" r="6" fill="url(#alexG)" stroke="#fecaca" stroke-width="1"/>
  <!-- small chevrons on either side of the crossguard, suggesting authority bars -->
  <path d="M22 66 L32 74 L32 58 Z" fill="url(#alexG)" opacity="0.85"/>
  <path d="M106 66 L96 74 L96 58 Z" fill="url(#alexG)" opacity="0.85"/>
  <!-- initial A on the blade -->
  <text x="64" y="48" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#0a0e1a" text-anchor="middle">A</text>
</svg>
