<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All-Agents Terminal — VirtualPC</title>
<style>
  :root {
    --bg-dark: #0f172a; --bg-darker: #020617;
    --text-primary: #e2e8f0; --text-secondary: #94a3b8;
    --border: rgba(148, 163, 184, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    background: var(--bg-darker); color: var(--text-primary);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 18px;
    background: var(--bg-dark);
    border-bottom: 1px solid var(--border);
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.05em; font-weight: 700; color: #60a5fa;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  header .meta { font-size: 0.78em; color: var(--text-secondary); margin-left: auto; display: flex; gap: 14px; align-items: center; }
  header a { color: #60a5fa; text-decoration: none; }
  header a:hover { text-decoration: underline; }

  .toolbar {
    padding: 10px 18px; background: rgba(15,23,42,0.6); border-bottom: 1px solid var(--border);
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .agent-chip {
    padding: 4px 10px; border-radius: 999px; font-size: 0.78em; cursor: pointer;
    background: rgba(148,163,184,0.06); border: 1px solid var(--border);
    user-select: none; transition: all 0.12s; display: inline-flex; align-items: center; gap: 5px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .agent-chip .swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .agent-chip.off { opacity: 0.35; text-decoration: line-through; }
  .agent-chip:hover { border-color: var(--text-primary); }
  .toolbar .ctl {
    margin-left: auto; display: flex; gap: 8px;
  }
  .toolbar button {
    background: rgba(96,165,250,0.18); color: #60a5fa; border: 1px solid #60a5fa;
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.78em;
    font-family: -apple-system, sans-serif; font-weight: 600;
  }
  .toolbar button:hover { background: rgba(96,165,250,0.32); }
  .toolbar button.paused { background: rgba(245,158,11,0.18); color: #f59e0b; border-color: #f59e0b; }

  #stream {
    flex: 1; padding: 12px 18px; overflow-y: auto;
    line-height: 1.55; font-size: 0.86em;
    background: var(--bg-darker);
  }
  #stream .row {
    padding: 1px 0; display: grid;
    grid-template-columns: 86px 100px 1fr;
    gap: 12px; white-space: pre;
  }
  #stream .ts { color: var(--text-secondary); font-size: 0.85em; }
  #stream .agent { font-weight: 700; }
  #stream .line { color: var(--text-primary); white-space: pre-wrap; word-break: break-word; }
  #stream .row.cmd .line { color: #60a5fa; }
  #stream .row.ok  .line { color: #22c55e; }
  #stream .row.err .line { color: #ef4444; }
  #stream .empty { color: var(--text-secondary); padding: 30px; text-align: center; font-style: italic; }

  footer {
    padding: 6px 18px; background: var(--bg-dark); border-top: 1px solid var(--border);
    font-size: 0.74em; color: var(--text-secondary); display: flex; gap: 20px;
  }
</style>
</head>
<body>
  <header>
    <h1>📟 All-Agents Terminal</h1>
    <div class="meta">
      <a href="/dashboard.html">← Dashboard</a>
      <a href="/agents.html">All Agents grid</a>
      <span id="status">connecting…</span>
    </div>
  </header>

  <div class="toolbar">
    <div id="chips"></div>
    <div class="ctl">
      <button id="allBtn">All on</button>
      <button id="noneBtn">All off</button>
      <button id="pauseBtn">⏸ Pause</button>
      <button id="clearBtn">🗑 Clear</button>
    </div>
  </div>

  <div id="stream"><div class="empty">Waiting for activity…</div></div>

  <footer>
    <span id="lineCount">0 lines</span>
    <span id="rate">— /min</span>
    <span id="lastUpdate">never</span>
    <span style="margin-left:auto">Polling /api/agents/cli-log/all every 2s</span>
  </footer>

<script>
let agents = [];
let visible = new Set();      // agent names that are currently shown
let paused = false;
let lastTs = null;
let buffered = [];            // lines received while paused
const MAX_LINES = 1500;
let lineCount = 0;
let rateWindow = [];          // ts of recently inserted lines (last 60s)

const stream = document.getElementById('stream');
const chipsEl = document.getElementById('chips');
const statusEl = document.getElementById('status');
const lineCountEl = document.getElementById('lineCount');
const rateEl = document.getElementById('rate');
const lastUpdateEl = document.getElementById('lastUpdate');
const pauseBtn = document.getElementById('pauseBtn');

async function loadAgents() {
  const r = await fetch('/api/agents/overview').then(r => r.json());
  agents = r.agents || [];
  visible = new Set(agents.map(a => a.name));   // start with all visible
  renderChips();
}

function renderChips() {
  chipsEl.innerHTML = agents.map(a => {
    const on = visible.has(a.name);
    return `<span class="agent-chip ${on ? '' : 'off'}" data-name="${a.name}">
              <span class="swatch" style="background:${a.color}"></span>${a.avatar} ${a.name}
            </span>`;
  }).join('');
  chipsEl.querySelectorAll('.agent-chip').forEach(el => {
    el.addEventListener('click', () => {
      const n = el.dataset.name;
      if (visible.has(n)) visible.delete(n); else visible.add(n);
      renderChips();
      filterStream();
    });
  });
}

function filterStream() {
  for (const row of stream.querySelectorAll('.row')) {
    row.style.display = visible.has(row.dataset.agent) ? '' : 'none';
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function appendRow(rowData) {
  // Drop the empty placeholder once we get a real row.
  const empty = stream.querySelector('.empty');
  if (empty) empty.remove();

  const time = new Date(rowData.ts).toLocaleTimeString();
  const div = document.createElement('div');
  div.className = 'row ' + (rowData.level || '');
  div.dataset.agent = rowData.agent;
  div.style.color = rowData.color;
  div.innerHTML =
    `<span class="ts">${time}</span>` +
    `<span class="agent" style="color:${rowData.color}">${rowData.avatar} ${rowData.agent}</span>` +
    `<span class="line">${escapeHtml(rowData.line)}</span>`;
  if (!visible.has(rowData.agent)) div.style.display = 'none';
  stream.appendChild(div);
  lineCount++;
  rateWindow.push(Date.now());

  // Cap the rendered backlog so we don't melt the DOM on long sessions.
  while (stream.children.length > MAX_LINES) stream.removeChild(stream.firstChild);

  // Auto-scroll only if the user hasn't scrolled up.
  const nearBottom = stream.scrollHeight - stream.clientHeight - stream.scrollTop < 80;
  if (nearBottom) stream.scrollTop = stream.scrollHeight;
}

async function poll() {
  try {
    const url = '/api/agents/cli-log/all?limit=30' + (lastTs ? '&since=' + encodeURIComponent(lastTs) : '');
    const r = await fetch(url).then(r => r.json());
    statusEl.textContent = '● live';
    statusEl.style.color = '#22c55e';
    if (!r.success || !r.lines || !r.lines.length) return;
    if (paused) {
      buffered.push(...r.lines);
      if (buffered.length > 5000) buffered = buffered.slice(-5000);
    } else {
      for (const line of r.lines) appendRow(line);
    }
    lastTs = r.lastTs;
    lastUpdateEl.textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    statusEl.textContent = '● offline';
    statusEl.style.color = '#ef4444';
  }
}

function tickRateAndCount() {
  const now = Date.now();
  rateWindow = rateWindow.filter(t => now - t < 60000);
  lineCountEl.textContent = lineCount.toLocaleString() + ' lines';
  rateEl.textContent = rateWindow.length + ' /min';
}

document.getElementById('allBtn').addEventListener('click', () => { agents.forEach(a => visible.add(a.name)); renderChips(); filterStream(); });
document.getElementById('noneBtn').addEventListener('click', () => { visible.clear(); renderChips(); filterStream(); });
document.getElementById('clearBtn').addEventListener('click', () => {
  stream.innerHTML = '<div class="empty">Cleared. Waiting for new lines…</div>';
  lineCount = 0; rateWindow = [];
});
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? '▶ Resume (' + buffered.length + ')' : '⏸ Pause';
  pauseBtn.classList.toggle('paused', paused);
  if (!paused && buffered.length) {
    for (const l of buffered) appendRow(l);
    buffered = [];
    pauseBtn.textContent = '⏸ Pause';
  }
});

(async () => {
  await loadAgents();
  await poll();
  setInterval(poll, 2000);
  setInterval(tickRateAndCount, 1000);
})();
</script>
</body>
</html>
