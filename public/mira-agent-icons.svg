<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="fill-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="kai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="zip-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mira-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="luna-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- FILL: CEO - Lion with Crown -->
  <g id="fill-icon">
    <circle cx="60" cy="60" r="55" fill="url(#fill-gradient)" opacity="0.2"/>

    <!-- Lion head -->
    <circle cx="60" cy="50" r="18" fill="url(#fill-gradient)"/>

    <!-- Mane -->
    <circle cx="40" cy="35" r="10" fill="url(#fill-gradient)"/>
    <circle cx="50" cy="25" r="10" fill="url(#fill-gradient)"/>
    <circle cx="60" cy="20" r="10" fill="url(#fill-gradient)"/>
    <circle cx="70" cy="25" r="10" fill="url(#fill-gradient)"/>
    <circle cx="80" cy="35" r="10" fill="url(#fill-gradient)"/>

    <!-- Crown points -->
    <polygon points="50,10 52,18 46,16" fill="url(#fill-gradient)"/>
    <polygon points="60,8 62,16 58,14" fill="url(#fill-gradient)"/>
    <polygon points="70,10 72,18 66,16" fill="url(#fill-gradient)"/>

    <!-- Eyes -->
    <circle cx="55" cy="48" r="2" fill="white"/>
    <circle cx="65" cy="48" r="2" fill="white"/>
  </g>

  <!-- KAI: CTO - Lightning Bolt with Gear -->
  <g id="kai-icon" transform="translate(150, 0)">
    <circle cx="60" cy="60" r="55" fill="url(#kai-gradient)" opacity="0.2"/>

    <!-- Lightning bolt -->
    <polygon points="60,20 70,45 60,45 75,70 50,45 60,45 50,20" fill="url(#kai-gradient)"/>

    <!-- Gear -->
    <circle cx="60" cy="60" r="15" fill="none" stroke="url(#kai-gradient)" stroke-width="2"/>
    <circle cx="60" cy="60" r="8" fill="url(#kai-gradient)" opacity="0.3"/>

    <!-- Gear teeth -->
    <rect x="58" y="42" width="4" height="5" fill="url(#kai-gradient)"/>
    <rect x="58" y="73" width="4" height="5" fill="url(#kai-gradient)"/>
    <rect x="42" y="58" width="5" height="4" fill="url(#kai-gradient)"/>
    <rect x="73" y="58" width="5" height="4" fill="url(#kai-gradient)"/>
  </g>

  <!-- ZIP: Developer - Code/Rocket -->
  <g id="zip-icon" transform="translate(300, 0)">
    <circle cx="60" cy="60" r="55" fill="url(#zip-gradient)" opacity="0.2"/>

    <!-- Rocket -->
    <polygon points="60,20 65,35 55,35" fill="url(#zip-gradient)"/>

    <!-- Rocket body -->
    <rect x="55" y="35" width="10" height="30" fill="url(#zip-gradient)"/>

    <!-- Rocket fins -->
    <polygon points="55,50 45,55 50,50" fill="url(#zip-gradient)"/>
    <polygon points="65,50 75,55 70,50" fill="url(#zip-gradient)"/>

    <!-- Rocket flame -->
    <polygon points="57,65 63,65 60,73" fill="#ff6b35"/>
    <polygon points="58,67 62,67 60,72" fill="#ffa500"/>
  </g>

  <!-- MIRA: Artist - Palette with Brush -->
  <g id="mira-icon" transform="translate(0, 150)">
    <circle cx="60" cy="60" r="55" fill="url(#mira-gradient)" opacity="0.2"/>

    <!-- Palette -->
    <ellipse cx="55" cy="65" rx="18" ry="15" fill="url(#mira-gradient)" opacity="0.3" stroke="url(#mira-gradient)" stroke-width="2"/>

    <!-- Color dots on palette -->
    <circle cx="48" cy="58" r="3" fill="#ff1493"/>
    <circle cx="55" cy="53" r="3" fill="#9d4edd"/>
    <circle cx="62" cy="55" r="3" fill="#00d4ff"/>
    <circle cx="65" cy="62" r="3" fill="#06b6d4"/>

    <!-- Brush handle -->
    <rect x="65" y="35" width="4" height="35" fill="url(#mira-gradient)"/>

    <!-- Brush bristles -->
    <ellipse cx="67" cy="35" rx="8" ry="4" fill="url(#mira-gradient)"/>
  </g>

  <!-- LUNA: Tech Artist - Star/Sparkle -->
  <g id="luna-icon" transform="translate(150, 150)">
    <circle cx="60" cy="60" r="55" fill="url(#luna-gradient)" opacity="0.2"/>

    <!-- Main star -->
    <polygon points="60,20 66,40 88,43 72,58 78,80 60,65 42,80 48,58 32,43 54,40" fill="url(#luna-gradient)"/>

    <!-- Sparkles around star -->
    <circle cx="35" cy="35" r="3" fill="url(#luna-gradient)"/>
    <circle cx="85" cy="30" r="3" fill="url(#luna-gradient)"/>
    <circle cx="90" cy="65" r="3" fill="url(#luna-gradient)"/>
    <circle cx="30" cy="70" r="3" fill="url(#luna-gradient)"/>

    <!-- Inner glow -->
    <polygon points="60,35 64,45 76,47 67,55 70,67 60,61 50,67 53,55 44,47 56,45" fill="url(#luna-gradient)" opacity="0.5"/>
  </g>
</svg>
