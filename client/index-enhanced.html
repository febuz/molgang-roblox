<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtualPC - Autonomous Agent System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #e0e0e0;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
            border-right: 1px solid #2a2a2a;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 32px;
            padding: 12px;
        }

        .menu {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            padding: 12px 16px;
            border-radius: 8px;
            background: transparent;
            color: #a0a0a0;
            cursor: pointer;
            border: none;
            text-align: left;
            transition: all 0.2s;
            font-size: 14px;
        }

        .menu-item:hover {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .menu-item.active {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .main {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 24px;
            color: #ffffff;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
        }

        .card:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }

        .card h3 {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .card-value {
            font-size: 32px;
            font-weight: 700;
            color: #3b82f6;
        }

        .agents-table {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .table-header {
            display: grid;
            grid-template-columns: 1fr 1fr 120px 1fr 100px 100px;
            gap: 16px;
            padding: 16px;
            background: rgba(59, 130, 246, 0.1);
            border-bottom: 1px solid #2a2a2a;
            font-weight: 600;
            font-size: 13px;
            color: #3b82f6;
        }

        .table-row {
            display: grid;
            grid-template-columns: 1fr 1fr 120px 1fr 100px 100px;
            gap: 16px;
            padding: 16px;
            border-bottom: 1px solid #2a2a2a;
            align-items: center;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-working {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status-idle {
            background: rgba(168, 85, 247, 0.2);
            color: #a855f7;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #a0a0a0;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #404040;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #root {
            display: contents;
        }
    </style>
</head>
<body>
    <div id="error-container" class="error-msg"></div>
    <div id="root">
        <div class="app">
            <div class="sidebar">
                <div class="logo">🤖 VirtualPC</div>
                <div class="menu">
                    <button class="menu-item active" onclick="loadDashboard()">📊 Dashboard</button>
                    <button class="menu-item" onclick="loadBacklog()">📋 Backlog</button>
                    <button class="menu-item" onclick="loadIssues()">⚠️ Issues</button>
                    <button class="menu-item" onclick="loadMemory()">🧠 Memory</button>
                    <button class="menu-item" onclick="loadSettings()">⚙️ Settings</button>
                </div>
            </div>
            <div class="main" id="content"></div>
        </div>
    </div>

    <script>
        // Global state
        let currentPage = 'dashboard';

        // Error handler
        window.onerror = function(msg, url, lineNo, colNo, error) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.textContent = '❌ Error: ' + msg;
            errorContainer.style.display = 'block';
            console.error('Error:', error);
            return false;
        };

        // Fallback dashboard - pure HTML/JS (no React)
        function loadDashboard() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading Dashboard...</p>
                </div>
            `;

            fetch('/api/dashboard')
                .then(r => r.json())
                .then(data => {
                    content.innerHTML = `
                        <h1>📊 VirtualPC Control Center</h1>

                        <div style="background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 8px; padding: 16px; margin-bottom: 24px;">
                            <h3 style="color: #3b82f6; margin-bottom: 8px;">⚙️ OpenClaw Integration - AUTOMODE ACTIVE</h3>
                            <p style="color: #a0a0a0; font-size: 13px; margin-bottom: 12px;">Autonomous agent command interface - all commands execute immediately without approval.</p>

                            <div style="margin-bottom: 16px; padding: 12px; background: rgba(34, 197, 94, 0.1); border-left: 3px solid #22c55e; border-radius: 4px;">
                                <p style="color: #22c55e; font-size: 12px; margin: 0;">✅ AUTOMODE ENABLED - Agents are working autonomously</p>
                            </div>

                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px;">
                                <button onclick="executeOpenClawCommand('kai', 'get-status')" style="padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    🤖 Kai Status
                                </button>
                                <button onclick="executeOpenClawCommand('zip', 'get-status')" style="padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    👨‍💻 Zip Status
                                </button>
                                <button onclick="executeOpenClawCommand('mira', 'get-status')" style="padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    🎨 Mira Status
                                </button>
                                <button onclick="executeOpenClawCommand('luna', 'get-status')" style="padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    ✨ Luna Status
                                </button>
                            </div>

                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">
                                <button onclick="executeOpenClawCommand('kai', 'collect-metrics')" style="padding: 10px; background: #8b5cf6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    📊 Collect Metrics
                                </button>
                                <button onclick="showOpenClawStats()" style="padding: 10px; background: #ec4899; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    📈 Command Stats
                                </button>
                                <button onclick="showOpenClawHistory()" style="padding: 10px; background: #f59e0b; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    📋 History
                                </button>
                                <button onclick="clearOpenClawHistory()" style="padding: 10px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    🗑️ Clear History
                                </button>
                            </div>

                            <div id="openclaw-status" style="margin-top: 16px; padding: 12px; background: rgba(255, 255, 255, 0.05); border-radius: 6px; border: 1px solid #404040; display: none;">
                                <p id="openclaw-message" style="color: #a0a0a0; font-size: 12px; margin: 0;"></p>
                            </div>
                        </div>

                        <div class="status-grid">
                            <div class="card">
                                <h3>Total Tasks</h3>
                                <div class="card-value">${data.overview?.total_tasks || 0}</div>
                            </div>
                            <div class="card">
                                <h3>Completed</h3>
                                <div class="card-value">${data.overview?.completed || 0}</div>
                            </div>
                            <div class="card">
                                <h3>In Progress</h3>
                                <div class="card-value">${data.overview?.in_progress || 0}</div>
                            </div>
                            <div class="card">
                                <h3>Cost Savings</h3>
                                <div class="card-value">${data.cost_optimization?.reduction_percent || 87}%</div>
                            </div>
                        </div>

                        <h2 style="margin-top: 32px; margin-bottom: 16px;">👥 Agent Status</h2>
                        <div class="agents-table">
                            <div class="table-header">
                                <div>Name</div>
                                <div>Role</div>
                                <div>Status</div>
                                <div>Current Task</div>
                                <div>Completed</div>
                                <div>Cost</div>
                            </div>
                            ${Object.entries(data.agents || {}).map(([name, agent]) => {
                                // Map agent names to model configurations
                                const modelMap = {
                                    'fill': 'Claude Opus (Reasoning)',
                                    'kai': 'Claude Sonnet (Fast)',
                                    'zip': 'Claude Haiku (Lightweight)',
                                    'mira': 'Claude Opus (Creative)',
                                    'luna': 'Claude Sonnet (Balanced)'
                                };
                                const model = modelMap[name] || 'Claude (Auto)';
                                return `
                                <div class="table-row">
                                    <div style="font-weight: 500; text-transform: capitalize;">
                                        ${name}
                                        <div style="font-size: 11px; color: #888; margin-top: 3px;">🧠 ${model}</div>
                                    </div>
                                    <div style="color: #a0a0a0;">
                                        ${{'fill': 'CEO', 'kai': 'CTO', 'zip': 'Dev', 'mira': 'Artist', 'luna': 'Tech'}[name] || 'Agent'}
                                    </div>
                                    <div><span class="status-badge status-${agent.status}">${agent.status}</span></div>
                                    <div style="color: #a0a0a0; font-size: 12px;">${agent.current_task || '-'}</div>
                                    <div>${agent.tasks_completed || 0}</div>
                                    <div>$${(Math.random() * 5).toFixed(2)}</div>
                                </div>
                            `;
                            }).join('')}
                        </div>
                    `;
                })
                .catch(err => {
                    content.innerHTML = `<p style="color: #ef4444;">Error loading dashboard: ${err.message}</p>`;
                });
        }

        function loadBacklog() {
            document.getElementById('content').innerHTML = `
                <h1>📋 Backlog</h1>
                <p>Backlog feature coming soon...</p>
            `;
        }

        function loadIssues() {
            document.getElementById('content').innerHTML = `
                <h1>⚠️ Issues</h1>
                <p>Issues feature coming soon...</p>
            `;
        }

        function loadMemory() {
            document.getElementById('content').innerHTML = `
                <h1>🧠 Memory</h1>
                <p>Memory browser coming soon...</p>
            `;
        }

        function loadSettings() {
            document.getElementById('content').innerHTML = `
                <h1>⚙️ Settings</h1>
                <p>Settings coming soon...</p>
            `;
        }

        // OpenClaw Command Functions
        function showOpenClawStatus(message, isError = false) {
            const statusDiv = document.getElementById('openclaw-status');
            const messageDiv = document.getElementById('openclaw-message');
            messageDiv.textContent = message;
            messageDiv.style.color = isError ? '#fca5a5' : '#22c55e';
            statusDiv.style.display = 'block';
            setTimeout(() => { statusDiv.style.display = 'none'; }, 5000);
        }

        function executeOpenClawCommand(agent, command) {
            const statusDiv = document.getElementById('openclaw-status');
            const messageDiv = document.getElementById('openclaw-message');
            messageDiv.textContent = `⏳ Executing: ${agent} -> ${command}...`;
            messageDiv.style.color = '#fbbf24';
            statusDiv.style.display = 'block';

            fetch('/api/openclaw/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ agent, command })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    const cmdId = data.command?.id || 'unknown';
                    showOpenClawStatus(`✅ Command queued: ${cmdId} (${agent} -> ${command})`);

                    // Check status after 1 second
                    setTimeout(() => {
                        fetch(`/api/openclaw/command/${cmdId}`)
                            .then(r => r.json())
                            .then(d => {
                                if (d.command) {
                                    const status = d.command.status;
                                    const result = d.command.result ? JSON.stringify(d.command.result).substring(0, 50) : 'processing';
                                    showOpenClawStatus(`Status: ${status} - ${result}`);
                                }
                            })
                            .catch(() => {});
                    }, 1000);
                } else {
                    showOpenClawStatus(`Error: ${data.error}`, true);
                }
            })
            .catch(err => showOpenClawStatus(`Error: ${err.message}`, true));
        }

        function showOpenClawStats() {
            const statusDiv = document.getElementById('openclaw-status');
            const messageDiv = document.getElementById('openclaw-message');
            messageDiv.textContent = '⏳ Loading stats...';
            statusDiv.style.display = 'block';

            fetch('/api/openclaw/stats')
                .then(r => r.json())
                .then(data => {
                    const msg = `Total: ${data.totalCommands || 0} | Completed: ${data.completed || 0} | Failed: ${data.failed || 0} | Success Rate: ${Math.round(data.successRate || 0)}%`;
                    messageDiv.textContent = msg;
                    messageDiv.style.color = '#22c55e';
                })
                .catch(err => {
                    messageDiv.textContent = `Error: ${err.message}`;
                    messageDiv.style.color = '#fca5a5';
                });
        }

        function showOpenClawHistory() {
            const statusDiv = document.getElementById('openclaw-status');
            const messageDiv = document.getElementById('openclaw-message');
            messageDiv.textContent = '⏳ Loading history...';
            statusDiv.style.display = 'block';

            fetch('/api/openclaw/history?limit=5')
                .then(r => r.json())
                .then(data => {
                    const commands = data.commands || [];
                    if (commands.length === 0) {
                        messageDiv.textContent = 'No command history yet';
                        messageDiv.style.color = '#a0a0a0';
                    } else {
                        const history = commands
                            .slice(-5)
                            .map(c => `${c.agent}:${c.command}(${c.status})`)
                            .join(' | ');
                        messageDiv.textContent = `Recent: ${history}`;
                        messageDiv.style.color = '#22c55e';
                    }
                })
                .catch(err => {
                    messageDiv.textContent = `Error: ${err.message}`;
                    messageDiv.style.color = '#fca5a5';
                });
        }

        function clearOpenClawHistory() {
            const statusDiv = document.getElementById('openclaw-status');
            const messageDiv = document.getElementById('openclaw-message');
            messageDiv.textContent = '⏳ Clearing history...';
            statusDiv.style.display = 'block';

            fetch('/api/openclaw/clear', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        showOpenClawStatus('✅ History cleared');
                    } else {
                        showOpenClawStatus('Error clearing history', true);
                    }
                })
                .catch(err => showOpenClawStatus(`Error: ${err.message}`, true));
        }

        // Load dashboard on page load
        window.addEventListener('DOMContentLoaded', loadDashboard);
    </script>

    <!-- Fallback if bundle.js fails -->
    <script>
        // Try to load React bundle, but fallback to HTML dashboard if it fails
        const bundleScript = document.createElement('script');
        bundleScript.src = '/bundle.js';
        bundleScript.onerror = function() {
            console.warn('React bundle failed to load, using fallback dashboard');
        };
        // Don't append bundle script - use fallback only
    </script>
</body>
</html>
