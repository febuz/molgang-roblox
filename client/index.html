<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtualPC - Autonomous Agent System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #e0e0e0;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
            border-right: 1px solid #2a2a2a;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 32px;
            padding: 12px;
        }

        .menu {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            padding: 12px 16px;
            border-radius: 8px;
            background: transparent;
            color: #a0a0a0;
            cursor: pointer;
            border: none;
            text-align: left;
            transition: all 0.2s;
            font-size: 14px;
        }

        .menu-item:hover {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .menu-item.active {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .main {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 24px;
            color: #ffffff;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
        }

        .card:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }

        .card h3 {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .card-value {
            font-size: 32px;
            font-weight: 700;
            color: #3b82f6;
        }

        .agents-table {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .table-header {
            display: grid;
            grid-template-columns: 1fr 1fr 120px 1fr 100px;
            gap: 16px;
            padding: 16px;
            background: rgba(59, 130, 246, 0.1);
            border-bottom: 1px solid #2a2a2a;
            font-weight: 600;
            font-size: 13px;
            color: #3b82f6;
        }

        .table-row {
            display: grid;
            grid-template-columns: 1fr 1fr 120px 1fr 100px;
            gap: 16px;
            padding: 16px;
            border-bottom: 1px solid #2a2a2a;
            align-items: center;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-working {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status-idle {
            background: rgba(168, 85, 247, 0.2);
            color: #a855f7;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #a0a0a0;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #404040;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #root {
            display: contents;
        }
    </style>
</head>
<body>
    <div id="error-container" class="error-msg"></div>
    <div id="root">
        <div class="app">
            <div class="sidebar">
                <div class="logo">🤖 VirtualPC</div>
                <div class="menu">
                    <button class="menu-item active" onclick="loadDashboard()">📊 Dashboard</button>
                    <button class="menu-item" onclick="loadTasks()">📑 Tasks</button>
                    <button class="menu-item" onclick="loadBacklog()">📋 Backlog</button>
                    <button class="menu-item" onclick="loadIssues()">⚠️ Issues</button>
                    <button class="menu-item" onclick="loadNumerai()">🔢 Numerai</button>
                    <button class="menu-item" onclick="loadMemory()">🧠 Memory</button>
                    <button class="menu-item" onclick="loadSettings()">⚙️ Settings</button>
                </div>
            </div>
            <div class="main" id="content"></div>
        </div>
    </div>

    <script>
        // Global state
        let currentPage = 'dashboard';

        // Error handler
        window.onerror = function(msg, url, lineNo, colNo, error) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.textContent = '❌ Error: ' + msg;
            errorContainer.style.display = 'block';
            console.error('Error:', error);
            return false;
        };

        // Fallback dashboard - pure HTML/JS (no React)
        function loadDashboard() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading Dashboard...</p>
                </div>
            `;

            fetch('/api/dashboard')
                .then(r => r.json())
                .then(data => {
                    content.innerHTML = `
                        <h1>📊 VirtualPC Control Center</h1>

                        <div style="background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 8px; padding: 16px; margin-bottom: 24px;">
                            <h3 style="color: #3b82f6; margin-bottom: 8px;">⚙️ OpenClaw Integration - AUTOMODE ACTIVE</h3>
                            <p style="color: #a0a0a0; font-size: 13px; margin-bottom: 12px;">Autonomous agent command interface - all commands execute immediately without approval.</p>

                            <div style="margin-bottom: 16px; padding: 12px; background: rgba(34, 197, 94, 0.1); border-left: 3px solid #22c55e; border-radius: 4px;">
                                <p style="color: #22c55e; font-size: 12px; margin: 0;">✅ AUTOMODE ENABLED - Agents are working autonomously</p>
                            </div>

                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px;">
                                <button onclick="executeOpenClawCommand('kai', 'get-status')" style="padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    🤖 Kai Status
                                </button>
                                <button onclick="executeOpenClawCommand('zip', 'get-status')" style="padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    👨‍💻 Zip Status
                                </button>
                                <button onclick="executeOpenClawCommand('mira', 'get-status')" style="padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    🎨 Mira Status
                                </button>
                                <button onclick="executeOpenClawCommand('luna', 'get-status')" style="padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    ✨ Luna Status
                                </button>
                            </div>

                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">
                                <button onclick="executeOpenClawCommand('kai', 'collect-metrics')" style="padding: 10px; background: #8b5cf6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    📊 Collect Metrics
                                </button>
                                <button onclick="showOpenClawStats()" style="padding: 10px; background: #ec4899; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    📈 Command Stats
                                </button>
                                <button onclick="showOpenClawHistory()" style="padding: 10px; background: #f59e0b; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    📋 History
                                </button>
                                <button onclick="clearOpenClawHistory()" style="padding: 10px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                                    🗑️ Clear History
                                </button>
                            </div>

                            <div id="openclaw-status" style="margin-top: 16px; padding: 12px; background: rgba(255, 255, 255, 0.05); border-radius: 6px; border: 1px solid #404040; display: none;">
                                <p id="openclaw-message" style="color: #a0a0a0; font-size: 12px; margin: 0;"></p>
                            </div>
                        </div>

                        <div class="status-grid">
                            <div class="card">
                                <h3>Total Tasks</h3>
                                <div class="card-value">${data.overview?.total_tasks || 0}</div>
                            </div>
                            <div class="card">
                                <h3>Completed</h3>
                                <div class="card-value">${data.overview?.completed || 0}</div>
                            </div>
                            <div class="card">
                                <h3>In Progress</h3>
                                <div class="card-value">${data.overview?.in_progress || 0}</div>
                            </div>
                        </div>

                        <h2 style="margin-top: 32px; margin-bottom: 16px;">👥 Agent Status</h2>
                        <div class="agents-table">
                            <div class="table-header" style="grid-template-columns: 1fr 1fr 120px 1fr 100px;">
                                <div>Name</div>
                                <div>Role</div>
                                <div>Status</div>
                                <div>Current Task</div>
                                <div>Completed</div>
                            </div>
                            ${Object.entries(data.agents || {}).map(([name, agent]) => {
                                // Map agent names to model configurations (local models)
                                const modelMap = {
                                    'fill': 'Qwen 27B',
                                    'kai': 'Qwen 27B',
                                    'zip': 'Qwen 14B',
                                    'mira': 'Phi 4 15B',
                                    'luna': 'DeepSeek R1 8B'
                                };
                                const model = modelMap[name] || 'Qwen 27B';
                                return `
                                <div class="table-row" style="grid-template-columns: 1fr 1fr 120px 1fr 100px;">
                                    <div style="font-weight: 500; text-transform: capitalize;">
                                        ${name}
                                        <div style="font-size: 11px; color: #888; margin-top: 3px;">🧠 ${model}</div>
                                    </div>
                                    <div style="color: #a0a0a0;">
                                        ${{'fill': 'CEO', 'kai': 'CTO', 'zip': 'Dev', 'mira': 'Artist', 'luna': 'Tech'}[name] || 'Agent'}
                                    </div>
                                    <div><span class="status-badge status-${agent.status}">${agent.status}</span></div>
                                    <div style="color: #a0a0a0; font-size: 12px;">${agent.current_task || '-'}</div>
                                    <div>${agent.tasks_completed || 0}</div>
                                </div>
                            `;
                            }).join('')}
                        </div>
                    `;
                })
                .catch(err => {
                    content.innerHTML = `<p style="color: #ef4444;">Error loading dashboard: ${err.message}</p>`;
                });
        }

        function loadTasks() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h1>📑 Task Scheduler</h1>
                <div id="tasks-loading" style="text-align: center; padding: 40px;">
                    <div style="font-size: 24px; color: #3b82f6;">⏳ Loading tasks...</div>
                </div>
            `;

            fetch('/api/tasks/schedule')
                .then(r => r.json())
                .then(data => {
                    const schedule = data.schedule || {};
                    const agents = ['fill', 'kai', 'zip', 'mira', 'luna'];
                    const agentNames = {
                        'fill': '👑 Fill (CEO)',
                        'kai': '🔧 Kai (CTO)',
                        'zip': '💻 Zip (Developer)',
                        'mira': '🎨 Mira (Artist)',
                        'luna': '⚡ Luna (Tech Artist)'
                    };

                    let html = `
                        <h1>📑 Task Scheduler</h1>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px;">
                    `;

                    agents.forEach(agent => {
                        const tasks = schedule[agent] || [];
                        const workload = data.agentWorkload?.[agent] || 0;
                        const efficiency = data.efficiency?.[agent] || 0.75;

                        html += `
                            <div class="card" style="padding: 20px;">
                                <h3 style="color: #ffffff; margin-bottom: 12px;">${agentNames[agent]}</h3>
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px;">
                                    <div style="padding: 8px; background: rgba(59, 130, 246, 0.1); border-radius: 4px; font-size: 12px;">
                                        <div style="color: #a0a0a0;">Tasks</div>
                                        <div style="color: #3b82f6; font-size: 18px; font-weight: 600;">${tasks.length}</div>
                                    </div>
                                    <div style="padding: 8px; background: rgba(34, 197, 94, 0.1); border-radius: 4px; font-size: 12px;">
                                        <div style="color: #a0a0a0;">Efficiency</div>
                                        <div style="color: #22c55e; font-size: 18px; font-weight: 600;">${Math.round(efficiency * 100)}%</div>
                                    </div>
                                </div>
                                ${tasks.length > 0 ? `
                                    <div style="font-size: 12px; color: #a0a0a0;">
                                        <div style="padding: 8px; background: rgba(0, 0, 0, 0.2); border-radius: 4px; margin-bottom: 8px; font-weight: 600; cursor: pointer;" onclick="showTaskDetails('${agent}')">
                                            📋 View ${tasks.length} task${tasks.length > 1 ? 's' : ''}
                                        </div>
                                    </div>
                                ` : '<div style="font-size: 12px; color: #a0a0a0; text-align: center; padding: 8px;">No active tasks</div>'}
                            </div>
                        `;
                    });

                    html += '</div>';

                    // Add in-progress summary section
                    let inProgressTasks = [];
                    agents.forEach(agent => {
                        const tasks = schedule[agent] || [];
                        tasks.forEach(task => {
                            if (task.status === 'in_progress' || task.status === 'running') {
                                inProgressTasks.push({ ...task, agent: agent });
                            }
                        });
                    });

                    if (inProgressTasks.length > 0) {
                        html += `
                            <h2 style="color: #ffffff; margin: 24px 0 16px 0;">⏳ In Progress Tasks</h2>
                            <div style="display: grid; grid-template-columns: 1fr; gap: 12px;">
                        `;

                        inProgressTasks.forEach(task => {
                            html += `
                                <div class="card" style="padding: 16px; cursor: pointer; border-left: 4px solid #3b82f6; transition: all 0.2s;" onclick="showTaskDetails('${task.agent}', '${task.id}')">
                                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px;">
                                        <h3 style="color: #ffffff;">${task.title}</h3>
                                        <span style="background: #3b82f6; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">IN PROGRESS</span>
                                    </div>
                                    <p style="font-size: 12px; color: #a0a0a0; margin-bottom: 8px;">${task.description}</p>
                                    <div style="display: flex; gap: 16px; font-size: 12px; color: #a0a0a0;">
                                        <div>👤 ${agentNames[task.agent]}</div>
                                        <div>⏱️ ${task.estimatedTime} mins</div>
                                        <div style="color: #3b82f6;">→ Click to view details</div>
                                    </div>
                                </div>
                            `;
                        });

                        html += '</div>';
                    }

                    content.innerHTML = html;
                })
                .catch(err => {
                    content.innerHTML = `<h1>📑 Task Scheduler</h1><p style="color: #ef4444;">Error loading tasks: ${err.message}</p>`;
                });
        }

        function showTaskDetails(agent, taskId) {
            const content = document.getElementById('content');
            const agentNames = {
                'fill': '👑 Fill (CEO)',
                'kai': '🔧 Kai (CTO)',
                'zip': '💻 Zip (Developer)',
                'mira': '🎨 Mira (Artist)',
                'luna': '⚡ Luna (Tech Artist)'
            };

            fetch(`/api/tasks/agent/${agent}`)
                .then(r => r.json())
                .then(data => {
                    const tasks = data.tasks || [];

                    let html = `
                        <h1>📑 ${agentNames[agent]} - Task Details</h1>
                        <button onclick="loadTasks()" style="margin-bottom: 16px; padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
                            ← Back to Scheduler
                        </button>
                        <div style="display: grid; grid-template-columns: 1fr; gap: 12px;">
                    `;

                    if (tasks.length === 0) {
                        html += '<div style="padding: 40px; text-align: center; color: #a0a0a0;">No tasks assigned to this agent</div>';
                    } else {
                        tasks.forEach(task => {
                            const statusColors = {
                                'pending': '#eab308',
                                'scheduled': '#3b82f6',
                                'running': '#06b6d4',
                                'in_progress': '#06b6d4',
                                'completed': '#22c55e',
                                'failed': '#ef4444'
                            };
                            const statusColor = statusColors[task.status] || '#a0a0a0';

                            html += `
                                <div class="card" style="padding: 20px; border-left: 4px solid ${statusColor};">
                                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                                        <div>
                                            <h3 style="color: #ffffff; margin-bottom: 4px;">${task.title}</h3>
                                            <p style="font-size: 13px; color: #a0a0a0;">${task.description}</p>
                                        </div>
                                        <span style="background: ${statusColor}; color: #000; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600;">
                                            ${task.status.toUpperCase().replace('_', ' ')}
                                        </span>
                                    </div>
                                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #2a2a2a;">
                                        <div>
                                            <div style="font-size: 11px; color: #a0a0a0; margin-bottom: 4px;">PRIORITY</div>
                                            <div style="color: #ffffff; font-weight: 600;">${task.priority.toUpperCase()}</div>
                                        </div>
                                        <div>
                                            <div style="font-size: 11px; color: #a0a0a0; margin-bottom: 4px;">ESTIMATED</div>
                                            <div style="color: #ffffff; font-weight: 600;">${task.estimatedTime} mins</div>
                                        </div>
                                        <div>
                                            <div style="font-size: 11px; color: #a0a0a0; margin-bottom: 4px;">CREATED</div>
                                            <div style="color: #ffffff; font-weight: 600;">${new Date(task.createdAt).toLocaleDateString()}</div>
                                        </div>
                                        <div>
                                            <div style="font-size: 11px; color: #a0a0a0; margin-bottom: 4px;">DEPENDENCIES</div>
                                            <div style="color: #ffffff; font-weight: 600;">${task.dependencies?.length || 0}</div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                    }

                    html += '</div>';
                    content.innerHTML = html;
                })
                .catch(err => {
                    content.innerHTML = `<h1>Error</h1><p style="color: #ef4444;">Failed to load task details: ${err.message}</p>`;
                });
        }

        function loadBacklog() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <h1>📋 Backlog Management</h1>
                <div id="backlog-loading" style="text-align: center; padding: 40px;">
                    <div style="font-size: 24px; color: #3b82f6;">⏳ Loading backlog...</div>
                </div>
            `;

            fetch('/api/backlog')
                .then(r => r.json())
                .then(data => {
                    const items = data.items || [];
                    const stats = data.by_priority || {};

                    let html = `
                        <h1>📋 Backlog Management</h1>
                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;">
                            <div class="card" style="text-align: center;">
                                <div style="font-size: 24px; color: #3b82f6;">${items.length}</div>
                                <div style="font-size: 12px; color: #a0a0a0; margin-top: 8px;">Total Items</div>
                            </div>
                            <div class="card" style="text-align: center;">
                                <div style="font-size: 24px; color: #ef4444;">${stats.high || 0}</div>
                                <div style="font-size: 12px; color: #a0a0a0; margin-top: 8px;">High Priority</div>
                            </div>
                            <div class="card" style="text-align: center;">
                                <div style="font-size: 24px; color: #eab308;">${stats.medium || 0}</div>
                                <div style="font-size: 12px; color: #a0a0a0; margin-top: 8px;">Medium Priority</div>
                            </div>
                            <div class="card" style="text-align: center;">
                                <div style="font-size: 24px; color: #22c55e;">${stats.low || 0}</div>
                                <div style="font-size: 12px; color: #a0a0a0; margin-top: 8px;">Low Priority</div>
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr; gap: 12px;">
                    `;

                    if (items.length === 0) {
                        html += '<div style="padding: 40px; text-align: center; color: #a0a0a0;">No backlog items found</div>';
                    } else {
                        items.forEach(item => {
                            const priorityColors = {
                                'high': '#ef4444',
                                'medium': '#eab308',
                                'low': '#22c55e'
                            };
                            const color = priorityColors[item.priority] || '#a0a0a0';
                            const statusColors = {
                                'pending': '#eab308',
                                'in_progress': '#3b82f6',
                                'completed': '#22c55e'
                            };
                            const statusColor = statusColors[item.status] || '#a0a0a0';

                            html += `
                                <div class="card" style="border-left: 4px solid ${color}; padding: 16px;">
                                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                                        <div>
                                            <h3 style="color: #ffffff; margin-bottom: 4px;">${item.title}</h3>
                                            <div style="font-size: 12px; color: #a0a0a0;">${item.description || 'No description'}</div>
                                        </div>
                                        <span style="background: ${statusColor}; color: #000; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 600;">
                                            ${item.status.toUpperCase().replace('_', ' ')}
                                        </span>
                                    </div>
                                    <div style="display: flex; gap: 16px; font-size: 12px; color: #a0a0a0;">
                                        <div>📌 ${item.assigned_to || 'Unassigned'}</div>
                                        <div>📅 ${item.sprint || 'No sprint'}</div>
                                        <div style="color: ${color}; font-weight: 600;">⚡ ${item.priority.toUpperCase()}</div>
                                    </div>
                                </div>
                            `;
                        });
                    }

                    html += '</div>';
                    content.innerHTML = html;
                })
                .catch(err => {

        // OpenClaw Command Functions
        function showOpenClawStatus(message, isError = false) {
            const statusDiv = document.getElementById('openclaw-status');
            const messageDiv = document.getElementById('openclaw-message');
            messageDiv.textContent = message;
            messageDiv.style.color = isError ? '#fca5a5' : '#22c55e';
            statusDiv.style.display = 'block';
            setTimeout(() => { statusDiv.style.display = 'none'; }, 5000);
        }

        function executeOpenClawCommand(agent, command) {
            const statusDiv = document.getElementById('openclaw-status');
            const messageDiv = document.getElementById('openclaw-message');
            messageDiv.textContent = `⏳ Executing: ${agent} -> ${command}...`;
            messageDiv.style.color = '#fbbf24';
            statusDiv.style.display = 'block';

            fetch('/api/openclaw/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ agent, command })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    const cmdId = data.command?.id || 'unknown';
                    showOpenClawStatus(`✅ Command queued: ${cmdId} (${agent} -> ${command})`);

                    // Check status after 1 second
                    setTimeout(() => {
                        fetch(`/api/openclaw/command/${cmdId}`)
                            .then(r => r.json())
                            .then(d => {
                                if (d.command) {
                                    const status = d.command.status;
                                    const result = d.command.result ? JSON.stringify(d.command.result).substring(0, 50) : 'processing';
                                    showOpenClawStatus(`Status: ${status} - ${result}`);
                                }
                            })
                            .catch(() => {});
                    }, 1000);
                } else {
                    showOpenClawStatus(`Error: ${data.error}`, true);
                }
            })
            .catch(err => showOpenClawStatus(`Error: ${err.message}`, true));
        }

        function showOpenClawStats() {
            const statusDiv = document.getElementById('openclaw-status');
            const messageDiv = document.getElementById('openclaw-message');
            messageDiv.textContent = '⏳ Loading stats...';
            statusDiv.style.display = 'block';

            fetch('/api/openclaw/stats')
                .then(r => r.json())
                .then(data => {
                    const msg = `Total: ${data.totalCommands || 0} | Completed: ${data.completed || 0} | Failed: ${data.failed || 0} | Success Rate: ${Math.round(data.successRate || 0)}%`;
                    messageDiv.textContent = msg;
                    messageDiv.style.color = '#22c55e';
                })
                .catch(err => {
                    messageDiv.textContent = `Error: ${err.message}`;
                    messageDiv.style.color = '#fca5a5';
                });
        }

        function showOpenClawHistory() {
            const statusDiv = document.getElementById('openclaw-status');
            const messageDiv = document.getElementById('openclaw-message');
            messageDiv.textContent = '⏳ Loading history...';
            statusDiv.style.display = 'block';

            fetch('/api/openclaw/history?limit=5')
                .then(r => r.json())
                .then(data => {
                    const commands = data.commands || [];
                    if (commands.length === 0) {
                        messageDiv.textContent = 'No command history yet';
                        messageDiv.style.color = '#a0a0a0';
                    } else {
                        const history = commands
                            .slice(-5)
                            .map(c => `${c.agent}:${c.command}(${c.status})`)
                            .join(' | ');
                        messageDiv.textContent = `Recent: ${history}`;
                        messageDiv.style.color = '#22c55e';
                    }
                })
                .catch(err => {
                    messageDiv.textContent = `Error: ${err.message}`;
                    messageDiv.style.color = '#fca5a5';
                });
        }

        function clearOpenClawHistory() {
            const statusDiv = document.getElementById('openclaw-status');
            const messageDiv = document.getElementById('openclaw-message');
            messageDiv.textContent = '⏳ Clearing history...';
            statusDiv.style.display = 'block';

            fetch('/api/openclaw/clear', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        showOpenClawStatus('✅ History cleared');
                    } else {
                        showOpenClawStatus('Error clearing history', true);
                    }
                })
                .catch(err => showOpenClawStatus(`Error: ${err.message}`, true));
        }

        // Load dashboard on page load
        window.addEventListener('DOMContentLoaded', loadDashboard);
    </script>

    <!-- Fallback if bundle.js fails -->
    <script>
        // Try to load React bundle, but fallback to HTML dashboard if it fails
        const bundleScript = document.createElement('script');
        bundleScript.src = '/bundle.js';
        bundleScript.onerror = function() {
            console.warn('React bundle failed to load, using fallback dashboard');
        };
        // Don't append bundle script - use fallback only
    </script>
</body>
</html>
