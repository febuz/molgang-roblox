<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOLGANG — The Molecular Chain</title>
  <meta name="description" content="MOLGANG Web Game — HD chemistry world with Three.js" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050810; }
    #canvas-container { width: 100%; height: 100%; }
    canvas { display: block; }
    #loading-screen {
      position: fixed; inset: 0;
      background: #050810;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100;
      font-family: 'Space Grotesk', sans-serif;
      color: #22c55e;
    }
    #loading-bar-wrap {
      width: 300px; height: 4px;
      background: #1a2a1a; border-radius: 2px;
      margin-top: 24px; overflow: hidden;
    }
    #loading-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    #loading-text {
      margin-top: 12px; font-size: 12px;
      color: #4a7a5a; letter-spacing: 2px;
      text-transform: uppercase;
    }
    #loading-logo {
      font-size: 48px; font-weight: 700;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #22c55e, #4ade80, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div id="loading-logo">MOLGANG</div>
    <div style="color:#4a7a5a; font-size:13px; margin-top:8px; letter-spacing:3px">THE MOLECULAR CHAIN</div>
    <div id="loading-bar-wrap">
      <div id="loading-bar"></div>
    </div>
    <div id="loading-text">Initializing renderer...</div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
