<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOLGANG — Joining from Roblox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #050810; color: #22c55e; font-family: monospace; }
    .join-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 16px;
    }
    .logo { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
    .status { font-size: 14px; color: #4a7a5a; letter-spacing: 2px; text-transform: uppercase; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #1a2a1a;
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #ef4444; font-size: 14px; text-align: center; max-width: 400px; }
  </style>
</head>
<body>
  <div class="join-screen">
    <div class="logo">MOLGANG</div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status-text">Verifying Roblox session...</div>
    <div class="error" id="error-text" style="display:none"></div>
  </div>
  <script type="module" src="/src/join.ts"></script>
</body>
</html>
